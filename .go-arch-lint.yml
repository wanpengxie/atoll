---
# go-arch-lint v3 — v2 topology architecture enforcement.
# Authoritative spec: .dalek/pm/coagent-topology-redesign.md §3 (12-component
# dependency matrix + T1–T9) + coagent-v2-arch-constraints-and-checks.md.
#
# v2 re-base: truth→server(channel-home); daemon=attached compute; lib=组合层
# (behavior/adapterhost/sysactor/agentactor/policy/channelkit); wire=home↔compute.
# Deployment-agnostic core (kernel/runtime/lib/adapters) never imports the
# deployment tier (wire/server/daemon/cmd). (kernel stdlib purity — no
# database/sql · net/http · gorilla — is enforced by grep in §2.1, not here:
# go-arch-lint governs inter-component + 3rd-party vendor edges, not stdlib.)

version: 3
workdir: .

allow:
  deepScan: true
  ignoreNotFoundComponents: true

exclude:
  - archive
  - node_modules
  - bin

excludeFiles:
  - "^.*_test\\.go$"

components:
  kernel:   { in: kernel/** }
  runtime:  { in: runtime/** }
  lib:      { in: lib/** }
  adapters: { in: adapters/** }
  wire:     { in: wire/** }
  server:   { in: server/** }
  daemon:   { in: daemon/** }
  sdk:      { in: sdk/** }
  obs:      { in: obs/** }
  internal: { in: internal/** }
  cmd:      { in: cmd/** }
  tests:    { in: tests/** }

deps:
  kernel:
    mayDependOn: [kernel]
  runtime:
    mayDependOn: [kernel, runtime]
    anyVendorDeps: true
  lib:
    mayDependOn: [kernel, runtime, lib]            # T4 — OTP behaviours on BEAM
    anyVendorDeps: true
  # 仲裁-1: adapters 实现 lib/behavior.Module(gen_server 契约)，故依赖 lib。关键
  # 纯度是 adapters↛runtime(不碰 goroutine/sqlite)，由 lib/behavior 只 import
  # kernel 保证传递纯度。组件级允许 lib；细分到 lib/behavior 待后续。
  adapters:
    mayDependOn: [kernel, lib, adapters]           # T3
    anyVendorDeps: true
  wire:
    mayDependOn: [kernel, wire]                     # T8 — pure schema
  server:
    mayDependOn: [kernel, runtime, lib, wire, internal, server]   # T5/T6 无 daemon/adapters
    anyVendorDeps: true
  daemon:
    mayDependOn: [kernel, runtime, lib, wire, daemon]             # T5/T6 无 server/adapters
    anyVendorDeps: true
  # sdk 务实允许 lib(AckDescriptor 等 caller-side 共用类型暂在 lib/behavior;
  # SDK kernel-only 的精确性待把共用类型搬 kernel 后收紧)。
  sdk:
    mayDependOn: [kernel, lib, sdk]
    anyVendorDeps: true
  obs:
    mayDependOn: [kernel, obs]
    anyVendorDeps: true
  internal:
    mayDependOn: [kernel, wire, internal]          # T9
  cmd:
    mayDependOn: [kernel, runtime, lib, adapters, wire, server, daemon, sdk, obs, internal, cmd]
    anyVendorDeps: true
  tests:
    mayDependOn: [kernel, runtime, lib, adapters, wire, server, daemon, sdk, obs, internal, cmd, tests]
    anyVendorDeps: true
# T1 由"核心 mayDependOn 不含 wire/server/daemon/cmd"自然成立
# T7 由"仅 cmd mayDependOn 含 obs"自然成立(其余组件 mayDependOn 均不列 obs)
