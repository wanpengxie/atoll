---
# go-arch-lint v3 — root module architecture enforcement (T2 spec §T2,
# applied here because §T6 acceptance criterion #6 explicitly requires
# `server -> runtime/*` and `server -> adapters/*` to be lint-rejected.
#
# Authoritative spec: .dalek/pm/m1.5-tickets.md §T2 + §T6.
#
# Maps the 6 ownership invariants from §T2 onto enforceable component
# boundaries. When T3 / T4 land they fill the runtime/ and adapters/
# trees; today both trees may be empty and `ignoreNotFoundComponents`
# keeps the build green until they exist.

version: 3
workdir: .

allow:
  # deepScan checks method-level boundary crossings. ON because the
  # M1.5 layout is clean.
  deepScan: true
  # runtime/ + adapters/ trees may not exist yet (T3 / T4 land later).
  ignoreNotFoundComponents: true

exclude:
  # archive/ holds legacy code preserved verbatim during the M1.5 rewrite —
  # out of architectural scope (includes the former agent-binary / cli-node
  # / lightcone-* trees after T9 archiving).
  - archive
  # pnpm dependencies may contain vendored Go fixtures; they are not part of
  # this module's architecture graph.
  - node_modules

excludeFiles:
  # Test files don't carry architectural constraints (per spec §T2
  # `excludeFiles: ["**/*_test.go"]`).
  - "^.*_test\\.go$"

components:
  # ─────────────────────────────────────────────────────────────────────
  # kernel — protocol contract core (interfaces + pure types + pure logic)
  # Invariants #1 + #2.
  # ─────────────────────────────────────────────────────────────────────
  kernel: { in: kernel/** }

  # ─────────────────────────────────────────────────────────────────────
  # runtime_ipc — daemon ↔ worker IPC wire types (Frame, Codec, payloads).
  # Pure: imports only kernel + stdlib. Shared by runtime (daemon-side
  # workerhost) and runtime_worker (worker subprocess). Splitting it out
  # is what lets runtime_worker stay sqlite-free while still talking
  # the IPC protocol (T3 spec §T3, invariant #6).
  # ─────────────────────────────────────────────────────────────────────
  runtime_ipc: { in: runtime/ipc/** }

  # ─────────────────────────────────────────────────────────────────────
  # runtime — daemon-side execution engine. Landed by T3.
  # Invariants #3 + #4.
  # ─────────────────────────────────────────────────────────────────────
  runtime: { in: runtime/** }
  runtime_worker: { in: runtime/worker/** }

  # ─────────────────────────────────────────────────────────────────────
  # adapters — adapter implementations. Landed by T4 / T5.
  # Invariants #4 + #5.
  # ─────────────────────────────────────────────────────────────────────
  adapters: { in: adapters/** }

  # ─────────────────────────────────────────────────────────────────────
  # server — central server (THIS ticket). MUST NOT depend on runtime/**
  # or adapters/**. MAY depend on kernel/** and pkg/**.
  # Invariants #1 + #2 + #5.
  # ─────────────────────────────────────────────────────────────────────
  server: { in: server/** }

  # ─────────────────────────────────────────────────────────────────────
  # cmd — process entry points. Composition root — may wire anything.
  # ─────────────────────────────────────────────────────────────────────
  cmd: { in: cmd/** }

  # ─────────────────────────────────────────────────────────────────────
  # pkg — public Go packages exported to 3rd-party callers.
  # ─────────────────────────────────────────────────────────────────────
  pkg: { in: pkg/** }

  # ─────────────────────────────────────────────────────────────────────
  # tests — end-to-end smoke test framework. Composition-root posture
  # like cmd/**: spins up real server/daemon/worker binaries and pokes
  # them via HTTP/WS. Build tag `e2e` keeps the suite out of the default
  # `go test ./...` run; `make e2e-smoke` is the dedicated entry point.
  # ─────────────────────────────────────────────────────────────────────
  tests: { in: tests/** }

vendors:
  # Vendor sets used by canUse whitelists.
  sqlite_driver: { in: ["modernc.org/sqlite", "modernc.org/sqlite/**"] }
  gorilla:       { in: "github.com/gorilla/**" }
  gin:           { in: "github.com/gin-gonic/**" }
  uuid:          { in: "github.com/google/uuid" }
  crypto:        { in: "golang.org/x/crypto/**" }
  migrate:       { in: "github.com/golang-migrate/migrate/**" }
  zerolog:       { in: ["github.com/rs/zerolog", "github.com/rs/zerolog/**"] }

deps:
  # ─────────────────────────────────────────────────────────────────────
  # kernel — closed at the project boundary AND the vendor boundary.
  # ─────────────────────────────────────────────────────────────────────
  kernel:
    mayDependOn: [kernel]
    # No canUse, no anyVendorDeps — kernel is fully closed at the vendor
    # boundary. FIX-T10: removed `uuid` allowance; kernel deals in opaque
    # string IDs only. If/when kernel needs an ID generator, it must be
    # injected from the runtime layer rather than imported here.

  runtime_ipc:
    # Pure wire-types package. Closed at project boundary: kernel + stdlib only.
    mayDependOn: [kernel]
    # No anyVendorDeps — runtime_ipc is closed (no sqlite, no gin, no kimi).

  runtime:
    mayDependOn: [kernel, runtime, runtime_ipc, runtime_worker, pkg]
    anyVendorDeps: true

  runtime_worker:
    # Strict subset of runtime: NO sqlite, NO server. MAY import runtime_ipc
    # (shared IPC wire types — T3 spec §T3 invariant #6).
    mayDependOn: [kernel, runtime_ipc, pkg]
    canUse:
      - uuid

  adapters:
    # adapters/** is a tree with internal layering:
    #   adapters/framework            (T4 outbound base)
    #   adapters/device/framework     (T5 device-side base)
    #   adapters/feishu, adapters/device/xhs, …
    # Sub-packages within adapters/** MAY import each other (same pattern
    # as server/**). The boundary that matters is adapters → server and
    # adapters → runtime (both excluded by NOT listing them here).
    mayDependOn: [kernel, adapters, pkg]
    anyVendorDeps: true

  server:
    # server uses sqlite for its OWN view-cache / placements / identity
    # tables (server-side cache is NOT the channel truth). May use
    # gin / gorilla / migrate / crypto. Sub-packages of server (server/
    # identity, server/catalog, server/gateway, …) freely import each
    # other — that is the intra-component composition root pattern.
    # The boundary that matters is server → runtime/** + server →
    # adapters/**, both excluded by NOT listing them here.
    mayDependOn: [kernel, server, pkg]
    canUse:
      - sqlite_driver
      - gin
      - gorilla
      - uuid
      - crypto
      - migrate
      - zerolog

  cmd:
    mayDependOn: [kernel, runtime, runtime_worker, adapters, server, pkg]
    anyVendorDeps: true

  pkg:
    # M1.6-T7 phase-2: pkg/logger ships a tiny zerolog facade reused by
    # cmd/* (server / daemon / worker) to emit structured JSON to stdout.
    # T169 adds pkg/coagentsdk, a public SDK that talks to /ws using the
    # same gorilla websocket client already used by the repo's e2e tests.
    mayDependOn: [kernel, pkg]
    canUse:
      - zerolog
      - gorilla

  tests:
    # tests/** is end-to-end smoke infrastructure — composition-root
    # posture mirroring cmd/**. Freely imports every internal component
    # plus any vendor it needs (sqlite, gorilla websocket, etc.).
    mayDependOn: [kernel, runtime, runtime_worker, runtime_ipc, adapters, server, pkg, tests]
    anyVendorDeps: true
