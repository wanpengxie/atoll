name: Release

# 发行 = 在 atoll 打一个 tag。别的都跟着它走。
#
# 一次发行只有一个对外版本号，就是这个 tag。它配的前端是 atoll-web 的哪个 tag，
# 由仓根的 WEB_VERSION 指定 —— 那是"这版 atoll 配哪版 UI"的唯一出处，人不用
# 记两个号，二进制自己也说得清（atoll version）。
#
# 发布动作：
#   1. 确认 WEB_VERSION 里写的 atoll-web tag 已经存在
#   2. git tag v0.01 && git push origin v0.01
#
# tag 只负责触发，不代表质量结论。发布前必须同时通过：
#   - 本 tag commit 上与日常 CI 完全相同的 Go lint/race/build；
#   - WEB_VERSION 指向的精确前端 tag 上的 unit/browser/build。
# 前端产物只构建一次：web-ci 测过什么，package 就嵌入什么。
#
# 出四个平台的包。纯 Go（modernc sqlite，无 CGO），所以一台 ubuntu runner
# 就能全出，不需要 mac runner。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.01）；不打 tag 的试跑用'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-ci:
    name: backend gate
    uses: ./.github/workflows/ci.yml

  web-ci:
    name: paired web gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: resolve paired web version
        id: web
        run: |
          version="$(tr -d '[:space:]' < WEB_VERSION)"
          [ -n "$version" ] || { echo "WEB_VERSION 为空"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: checkout paired web tag
        uses: actions/checkout@v4
        with:
          repository: wanpengxie/atoll-web
          ref: ${{ steps.web.outputs.version }}
          path: .cache/atoll-web

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .cache/atoll-web/package-lock.json

      - name: install web dependencies
        working-directory: .cache/atoll-web
        run: npm ci

      - name: install browser
        working-directory: .cache/atoll-web
        run: npx playwright install --with-deps chromium

      - name: test and build paired web
        working-directory: .cache/atoll-web
        run: npm run test:ci

      - name: retain tested web bundle
        uses: actions/upload-artifact@v4
        with:
          name: paired-web-dist
          path: .cache/atoll-web/dist
          if-no-files-found: error
          retention-days: 1

    outputs:
      version: ${{ steps.web.outputs.version }}

  release:
    name: package + smoke + publish
    needs: [core-ci, web-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: resolve version
        id: v
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "atoll $version + atoll-web ${{ needs.web-ci.outputs.version }}"

      # 恒使用 web-ci 已测试的同一份字节，避免测试后重新 clone/build 的时间窗。
      - name: restore tested web bundle
        uses: actions/download-artifact@v4
        with:
          name: paired-web-dist
          path: web/dist

      - name: package
        run: make package VERSION=${{ steps.v.outputs.version }}

      - name: smoke test the linux build
        run: |
          tar -xzf dist/atoll_${{ steps.v.outputs.version }}_linux_amd64.tar.gz -C /tmp
          bin=/tmp/atoll_${{ steps.v.outputs.version }}_linux_amd64/atoll
          "$bin" version
          # 装完就要能打开——一个自己不吐 UI 的包不算装好了
          "$bin" up --dir /tmp/smoke --addr 127.0.0.1:8899 --root-password smoketest123 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8899/healthz >/dev/null && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8899/healthz
          curl -fsS http://127.0.0.1:8899/ | grep -qi '<!doctype html' \
            || { echo "根路径没有吐出页面——UI 没打进去"; exit 1; }
          kill %1 || true

      - name: publish
        # workflow_dispatch 是不打 tag 的全链路试跑，恒不得暗中创建 release/tag。
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" \
            --title "atoll ${{ steps.v.outputs.version }}" \
            --notes "$(printf '装：\n\n```\ncurl -fsSL https://raw.githubusercontent.com/%s/main/scripts/install.sh | bash\n```\n\n前端：atoll-web %s\n' "$GITHUB_REPOSITORY" "${{ needs.web-ci.outputs.version }}")" \
            dist/*.tar.gz dist/checksums.txt
