name: go-ci

# CI for the daemon-go module (lightcone/daemon-go).
#
# Scope is intentionally scoped to daemon-go at T0 — the existing
# xhs-cli module has its own pre-T0 hygiene state and pulling it in
# now would conflate two unrelated cleanups. xhs-cli CI can be added
# in a follow-up ticket once its lint debt is settled.
#
# Introduced by ticket M1.3-T0 (.dalek/pm/m1.3-tickets.md §T0).

on:
  push:
    branches: [main]
    paths:
      - 'lightcone/daemon-go/**'
      - '.github/workflows/go-ci.yml'
      - '.golangci.yml'
  pull_request:
    paths:
      - 'lightcone/daemon-go/**'
      - '.github/workflows/go-ci.yml'
      - '.golangci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lightcone/daemon-go

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: lightcone/daemon-go/go.mod
          cache: true
          cache-dependency-path: lightcone/daemon-go/go.sum

      - name: go version
        run: go version

      - name: go build ./...
        run: go build ./...

      - name: go test ./...
        run: go test ./... -race -count=1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: lightcone/daemon-go/go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: lightcone/daemon-go
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=5m
