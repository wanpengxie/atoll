name: CI

# CI gate. Pipeline: install → lint → test → build (top-level Makefile targets).
#
# lint = `go vet` + archtest (`go test ./archtest/`) — archtest is the live
# architecture/contract guard. NB (2026-06-11): the old "5-class lint" discipline
# (golangci-lint + scripts/lint-*.sh referencing the deleted v1 topology
# kernel/adapters/server/...) was ripped as dead tooling (installed-but-never-run
# golangci + zero-invoked scripts); archtest replaced its architecture checks.
#
# TODO(lint-rebuild): a v2-topology lint rebuild is deferred (痛感-driven). When
# rebuilt, restore the guards archtest does NOT currently cover — grep
# `TODO(lint-rebuild)` for the sites:
#   - inter-layer import matrix (protocol/* ↛ runtime/*; full component deps)
#   - protocol/ stdlib-purity (no context/sql/http) — INVARIANT-1
#   - protocol must not link `testing`
#   - banned-word policy (no dogfood / MCP / 1studio / lightcone), formerly
#     scripts/lint-banned-words.sh.
#
# Scope: single root go module.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discipline:
    name: install + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: make deps
        run: make deps

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: make build
        run: make build
