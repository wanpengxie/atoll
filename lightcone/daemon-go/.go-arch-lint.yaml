---
# go-arch-lint v3 configuration for the daemon-go module.
#
# Authoritative spec: .dalek/pm/m1.5-tickets.md §T2.
#
# Purpose: turn the 6 Ownership Invariants (m1.5-tickets §T2 table) from
# documentation into enforceable lint. CI fails the build when any
# invariant is violated.
#
# v3 schema reference:
#   https://github.com/fe3dback/go-arch-lint
#
# Notes on encoding the spec:
#
#   - Spec uses `mustNotDependOn`; v3 schema only supports `mayDependOn`
#     (a whitelist). The forbidden lists are therefore expressed by
#     NOT listing the component / vendor. Each component block carries
#     a YAML comment naming the invariants it covers.
#   - Stdlib imports are auto-allowed by go-arch-lint (they are not
#     vendor packages). The kernel ban on `database/sql` / `net/http`
#     is documented at the kernel block; reviewer-side enforcement
#     applies plus the `go list -deps ./kernel/...` smoke check in
#     `make daemon-go-kernel-deps-check`.
#   - The `internal` component is TRANSITIONAL: existing daemon-go
#     code lives under internal/. T3 (.dalek/pm/m1.5-tickets.md §T3)
#     migrates internal/ contents to runtime/ + server/ + adapters/.
#     When T3 lands, delete the `internal` block + remove `internal`
#     from `cmd.mayDependOn`.

version: 3
workdir: .

allow:
  # deepScan is OFF for the transition period — the existing
  # internal/* layout produces false positives on the "method call
  # crosses component boundary" check. Re-enable when T3 finishes the
  # internal/ → runtime/ + server/ + adapters/ migration.
  deepScan: false
  # Components with no matching files (e.g. runtime/ before T3) are
  # silently skipped instead of triggering "component not found".
  ignoreNotFoundComponents: true

exclude:
  # Test fixtures + e2e harness sit outside the architecture taxonomy.
  - test
  # archive/ is reserved for legacy code preserved verbatim during the
  # M1.5 rewrite — out of architectural scope.
  - archive

excludeFiles:
  # Test files don't carry architectural constraints (per spec §T2
  # `excludeFiles: ["**/*_test.go"]`).
  - "^.*_test\\.go$"

components:
  # ─────────────────────────────────────────────────────────────────────
  # kernel — protocol contract core (interfaces + pure types + pure logic)
  #
  # MUST NOT depend on:
  #   - any internal component (runtime/adapters/server/cmd/pkg/ui/internal)
  #   - sqlite drivers, net/http, gorilla, gin, go-kimi
  #
  # Invariant coverage:
  #   #1 channel sqlite truth = daemon   (kernel exposes interface only)
  #   #2 kernel runtime = daemon         (kernel ⊄ runtime)
  # ─────────────────────────────────────────────────────────────────────
  kernel: { in: kernel/** }

  # ─────────────────────────────────────────────────────────────────────
  # runtime — daemon-side execution engine (sqlite-backed kernel impls,
  # supervisor, scheduler, bootstrap, transit, lifecycle, workerhost,
  # worker subprocess runtime).
  #
  # MUST NOT depend on: server/**, server/identity/**
  # MAY depend on: kernel
  #
  # Invariant coverage:
  #   #3 directory = server  (runtime ⊄ server/**)
  #   #4 session = server    (runtime ⊄ server/identity/**)
  # ─────────────────────────────────────────────────────────────────────
  runtime: { in: runtime/** }

  # ─────────────────────────────────────────────────────────────────────
  # runtime_worker — worker SUBPROCESS runtime (covers invariant #6).
  #
  # Stricter than `runtime`: worker subprocess does NOT hold sqlite
  # write rights — every state mutation must IPC to daemon. Therefore:
  #   - MUST NOT import runtime/store
  #   - MUST NOT import database/sql or any sqlite driver
  #   - MAY import kernel and runtime/workerhost (IPC client)
  #
  # Invariant coverage: #6 worker = daemon spawn
  # ─────────────────────────────────────────────────────────────────────
  runtime_worker: { in: runtime/worker/** }

  # ─────────────────────────────────────────────────────────────────────
  # adapters — adapter implementations (xhs, feishu, slack, github, …).
  #
  # MUST NOT depend on: server/**, server/identity/**, runtime/**
  # (DeviceTransit comes from kernel/adapter, runtime composes the
  # impl in cmd/daemon).
  # MAY depend on: kernel
  #
  # Invariant coverage:
  #   #4 session = server  (adapters ⊄ server/identity/**)
  #   #5 adapter = daemon  (covers codex 警告 #15)
  # ─────────────────────────────────────────────────────────────────────
  adapters: { in: adapters/** }

  # ─────────────────────────────────────────────────────────────────────
  # server — central server (placement, devicebus, identity, view cache).
  #
  # MUST NOT depend on: runtime/**, adapters/**
  # MAY depend on: kernel
  #
  # Invariant coverage:
  #   #1 channel sqlite truth = daemon   (server ⊄ runtime/store)
  #   #2 kernel runtime = daemon         (server ⊄ runtime/*)
  #   #5 adapter = daemon                (server ⊄ adapters/*)
  # ─────────────────────────────────────────────────────────────────────
  server: { in: server/** }

  # ─────────────────────────────────────────────────────────────────────
  # cmd — process entry points (daemon / worker / migrate / coagent).
  # Composition root — may wire everything together.
  # ─────────────────────────────────────────────────────────────────────
  cmd: { in: cmd/** }

  # ─────────────────────────────────────────────────────────────────────
  # pkg — public Go packages that 3rd-party callers may import.
  # Today: pkg/v4types (kernel type re-export), pkg/canonical,
  # pkg/harness, pkg/adapter, pkg/coagent, pkg/kimismoke.
  # MAY depend on kernel only (no impl deps leaked).
  # ─────────────────────────────────────────────────────────────────────
  pkg: { in: pkg/** }

  # ─────────────────────────────────────────────────────────────────────
  # ui — UI bridge code (reserved for future).
  # ─────────────────────────────────────────────────────────────────────
  ui: { in: ui/** }

  # ─────────────────────────────────────────────────────────────────────
  # internal — TRANSITIONAL (T3 will migrate to runtime/server/adapters).
  # Kept permissive while the M1.3 layout is still in flight.
  #
  # TODO(T3): when migration completes, delete this block and remove
  # `internal` from `cmd.mayDependOn` + `pkg.mayDependOn`.
  # ─────────────────────────────────────────────────────────────────────
  internal: { in: internal/** }

vendors:
  # Forbidden-for-kernel vendor sets — listed here so that runtime /
  # adapters / server explicitly OPT IN via `canUse:`. Components that
  # do not list these vendors cannot import them.
  sqlite_driver: { in: ["github.com/mattn/go-sqlite3", "modernc.org/sqlite", "modernc.org/sqlite/**"] }
  go_kimi:       { in: "github.com/wanpengxie/go-kimi/**" }
  gorilla:       { in: "github.com/gorilla/**" }
  gin:           { in: "github.com/gin-gonic/**" }

  # Vendors that kernel-side pure-logic code is allowed to use:
  uuid:          { in: "github.com/google/uuid" }
  jsonschema:    { in: "github.com/santhosh-tekuri/jsonschema/v5" }

deps:
  # ─────────────────────────────────────────────────────────────────────
  # kernel — closed at the project boundary AND the vendor boundary.
  # ─────────────────────────────────────────────────────────────────────
  kernel:
    # No internal-component imports OUTSIDE the kernel tree itself.
    # Kernel sub-packages (kernel/message, kernel/log, …) freely import
    # each other — that is part of the protocol contract — but the
    # kernel tree cannot import runtime / adapters / server / pkg.
    mayDependOn: [kernel]
    # Whitelist of vendors kernel may use. The sqlite_driver / go_kimi /
    # gorilla / gin vendor sets are NOT listed → kernel cannot import
    # them. (Stdlib like context / encoding/json / time is auto-allowed
    # and does not need to be enumerated.)
    canUse:
      - uuid
      - jsonschema
    # anyVendorDeps defaults to false because canUse is set.

  runtime:
    mayDependOn: [kernel, runtime, runtime_worker, internal, pkg]
    # runtime owns sqlite + go-kimi + network-server wiring (workerhost
    # transit). Vendor whitelist is intentionally broad here; the
    # boundary that matters is BETWEEN runtime/worker and runtime/store
    # (handled by the runtime_worker block).
    anyVendorDeps: true

  runtime_worker:
    mayDependOn: [kernel, internal, pkg]
    # runtime_worker is a STRICT subset of runtime — worker subprocess
    # has no sqlite write rights. sqlite_driver is NOT in canUse.
    canUse:
      - go_kimi
      - uuid
      - jsonschema

  adapters:
    mayDependOn: [kernel, pkg]
    anyVendorDeps: true

  server:
    # server may use sqlite for its OWN view cache + placements +
    # identity tables (server-side cache is NOT the channel truth).
    mayDependOn: [kernel, pkg]
    anyVendorDeps: true

  cmd:
    # Composition root — wires kernel + runtime + adapters + server.
    # `internal` + `pkg` included while the M1.3 layout is still live.
    mayDependOn: [kernel, runtime, runtime_worker, adapters, server, internal, pkg]
    anyVendorDeps: true

  pkg:
    # pkg packages currently bridge runtime/internal abstractions for
    # external callers. After T3 migration, this can be tightened to
    # [kernel] per spec §T2.
    mayDependOn: [kernel, internal, pkg]
    anyVendorDeps: true

  ui:
    mayDependOn: [kernel]
    anyVendorDeps: true

  internal:
    # Transitional: existing pre-M1.5 internal/* packages are allowed
    # to reference each other and kernel + pkg. T3 dissolves this block.
    mayDependOn: [kernel, internal, pkg]
    anyVendorDeps: true
