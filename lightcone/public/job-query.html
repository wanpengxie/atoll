<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校招岗位查询</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080c14;
      --surface:   #0f1623;
      --border:    #1e2a3a;
      --accent:    #f59e0b;
      --accent2:   #fb923c;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --green:     #34d399;
      --red:       #f87171;
    }

    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245,158,11,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,158,11,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow blob */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(245,158,11,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* Header */
    .header {
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .header-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    /* Query Card */
    .query-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      animation: fadeUp 0.6s 0.1s ease both;
      position: relative;
      overflow: hidden;
    }

    .query-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .query-card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .form-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 160px;
    }

    .form-group label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .form-group input[type="date"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      colorscheme: dark;
    }

    .form-group input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
    }

    .quick-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .quick-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(245,158,11,0.06);
    }

    .search-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #000;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 28px;
      transition: all 0.2s;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .search-btn:hover {
      background: var(--accent2);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(245,158,11,0.3);
    }

    .search-btn:active {
      transform: translateY(0);
    }

    .search-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Stats Bar */
    .stats-bar {
      display: none;
      gap: 24px;
      margin-bottom: 24px;
      animation: fadeUp 0.4s ease both;
    }

    .stats-bar.visible {
      display: flex;
      flex-wrap: wrap;
    }

    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      flex: 1;
      min-width: 140px;
    }

    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* Table */
    .table-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }

    .table-card.visible {
      display: block;
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .table-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }

    .table-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .export-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }

    .export-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 24px;
      text-align: left;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }

    thead th:last-child { text-align: right; }

    tbody tr {
      border-bottom: 1px solid rgba(30,42,58,0.6);
      transition: background 0.15s;
      animation: rowIn 0.3s ease both;
    }

    tbody tr:hover { background: rgba(245,158,11,0.04); }
    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 13px 24px;
      font-size: 0.9rem;
    }

    .rank-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      width: 50px;
    }

    .rank-medal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .rank-1 { background: rgba(245,158,11,0.2); color: var(--accent); }
    .rank-2 { background: rgba(148,163,184,0.15); color: #94a3b8; }
    .rank-3 { background: rgba(251,146,60,0.15); color: var(--accent2); }

    .company-cell {
      font-weight: 500;
    }

    .count-cell {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--accent);
    }

    .bar-cell {
      padding-right: 24px;
    }

    .bar-track {
      height: 4px;
      background: rgba(30,42,58,1);
      border-radius: 2px;
      overflow: hidden;
      min-width: 80px;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
    }

    /* Loading */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px;
      gap: 16px;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .loading-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* Error */
    .error-msg {
      display: none;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 10px;
      padding: 16px 20px;
      color: var(--red);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .error-msg.visible { display: block; }

    /* Empty state */
    .empty-state {
      display: none;
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
    }

    .empty-state.visible { display: block; }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      .search-btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-badge">CAMPUS RECRUITMENT · 校招岗位分析</div>
    <h1>校招岗位查询</h1>
    <p>按时间范围查看 <strong style="color:var(--accent)">有效校招岗位</strong>，统计各公司投递量排名</p>
  </div>

  <!-- Query Card -->
  <div class="query-card">
    <h2>时间范围筛选</h2>
    <div style="margin-bottom:16px">
      <div class="quick-btns" id="quickBtns"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>开始日期</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-group">
        <label>结束日期</label>
        <input type="date" id="endDate">
      </div>
      <button class="search-btn" id="searchBtn" onclick="doSearch()">查询</button>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <div class="stat-label">总有效岗位</div>
      <div class="stat-value" id="statTotal">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">公司数量</div>
      <div class="stat-value" id="statCompanies">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">查询日期</div>
      <div class="stat-value" style="font-size:1rem;padding-top:4px" id="statRange">—</div>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card" id="tableCard">
    <div class="table-header">
      <div>
        <div class="table-title">按公司排名</div>
        <div class="table-subtitle" id="tableSubtitle"></div>
      </div>
      <button class="export-btn" onclick="exportCSV()">↓ 导出 CSV</button>
    </div>

    <!-- Loading inside table card -->
    <div class="loading" id="loadingDiv">
      <div class="spinner"></div>
      <div class="loading-text">正在查询数据库…</div>
    </div>

    <!-- Empty -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📭</div>
      <div class="empty-text">该时间段内没有校招岗位数据</div>
    </div>

    <div class="table-wrapper" id="tableWrapper">
      <table id="resultsTable">
        <thead>
          <tr>
            <th style="width:50px">#</th>
            <th>公司名称</th>
            <th style="width:200px">占比</th>
            <th style="width:100px;text-align:right">岗位数</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const API_BASE = ``;
  let currentData = null;

  // Initialize quick date buttons
  function initQuickBtns() {
    const today = new Date();
    const fmt = d => d.toISOString().slice(0,10);
    const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
    const w7ago = new Date(today); w7ago.setDate(today.getDate()-7);
    const m1ago = new Date(today); m1ago.setDate(today.getDate()-30);
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

    const presets = [
      { label: '昨天',   start: fmt(yesterday), end: fmt(yesterday) },
      { label: '最近7天', start: fmt(w7ago),    end: fmt(today) },
      { label: '最近30天', start: fmt(m1ago),   end: fmt(today) },
      { label: '本月',   start: fmt(monthStart), end: fmt(today) },
    ];

    const container = document.getElementById('quickBtns');
    presets.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'quick-btn';
      btn.textContent = p.label;
      btn.onclick = () => {
        document.getElementById('startDate').value = p.start;
        document.getElementById('endDate').value = p.end;
      };
      container.appendChild(btn);
    });

    // Default: yesterday
    document.getElementById('startDate').value = fmt(yesterday);
    document.getElementById('endDate').value = fmt(yesterday);
  }

  async function doSearch() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    const btn = document.getElementById('searchBtn');

    if (!start || !end) {
      showError('请选择开始和结束日期');
      return;
    }
    if (start > end) {
      showError('开始日期不能晚于结束日期');
      return;
    }

    clearError();
    btn.disabled = true;
    btn.textContent = '查询中…';

    showTableCard(true);
    showLoading(true);
    showEmpty(false);
    showTableBody(false);

    try {
      const res = await fetch(`${API_BASE}/api/jobs?start_date=${start}&end_date=${end}`);
      const json = await res.json();

      if (!res.ok) {
        throw new Error(json.error || '服务器错误');
      }

      currentData = json;
      renderResults(json);
    } catch (err) {
      showError('查询失败：' + err.message);
      showTableCard(false);
    } finally {
      btn.disabled = false;
      btn.textContent = '查询';
      showLoading(false);
    }
  }

  function renderResults(json) {
    const { total, companies, start_date, end_date, data } = json;

    // Stats
    document.getElementById('statTotal').textContent = total.toLocaleString();
    document.getElementById('statCompanies').textContent = companies.toLocaleString();
    document.getElementById('statRange').textContent = start_date === end_date
      ? start_date
      : `${start_date} ~ ${end_date}`;
    document.getElementById('statsBar').classList.add('visible');

    document.getElementById('tableSubtitle').textContent =
      `共 ${companies} 家公司 · ${total} 个校招岗位`;

    if (!data || data.length === 0) {
      showEmpty(true);
      showTableBody(false);
      return;
    }

    const maxCount = data[0].job_count;
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    data.forEach((row, i) => {
      const rank = i + 1;
      const pct = ((row.job_count / maxCount) * 100).toFixed(1);
      const tr = document.createElement('tr');
      tr.style.animationDelay = `${Math.min(i * 20, 300)}ms`;

      let rankHtml;
      if (rank <= 3) {
        rankHtml = `<span class="rank-medal rank-${rank}">${rank}</span>`;
      } else {
        rankHtml = `<span style="color:var(--muted);font-size:0.75rem;font-family:'JetBrains Mono',monospace">${rank}</span>`;
      }

      tr.innerHTML = `
        <td class="rank-cell">${rankHtml}</td>
        <td class="company-cell">${escapeHtml(row.company_name || '未知')}</td>
        <td class="bar-cell">
          <div class="bar-track">
            <div class="bar-fill" style="width:0%" data-width="${pct}%"></div>
          </div>
        </td>
        <td class="count-cell">${row.job_count}</td>
      `;
      tbody.appendChild(tr);
    });

    showTableBody(true);

    // Animate bars after DOM paint
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.querySelectorAll('.bar-fill').forEach(el => {
          el.style.width = el.dataset.width;
        });
      });
    });
  }

  function exportCSV() {
    if (!currentData || !currentData.data) return;
    const { start_date, end_date, data } = currentData;
    const rows = [['排名', '公司名称', '岗位数']];
    data.forEach((row, i) => {
      rows.push([i+1, row.company_name, row.job_count]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `校招岗位_${start_date}_${end_date}.csv`;
    a.click();
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function clearError() {
    document.getElementById('errorMsg').classList.remove('visible');
  }

  function showTableCard(v) {
    document.getElementById('tableCard').classList.toggle('visible', v);
  }

  function showLoading(v) {
    document.getElementById('loadingDiv').classList.toggle('visible', v);
  }

  function showEmpty(v) {
    document.getElementById('emptyState').classList.toggle('visible', v);
  }

  function showTableBody(v) {
    document.getElementById('tableWrapper').style.display = v ? 'block' : 'none';
  }

  initQuickBtns();
</script>
</body>
</html>
