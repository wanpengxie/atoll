<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lightcone</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root {
  --bg:         #D4C5A9;
  --surface:    #F5F0E8;
  --surface-2:  #EDE6D8;
  --surface-3:  #E5DCCC;
  --border:     rgba(58,50,38,0.12);
  --border-2:   rgba(58,50,38,0.20);
  --text:       #2E2419;
  --text-muted: #7A6E5E;
  --text-dim:   #A89E8E;
  --accent:     #E4002B;
  --accent-bg:  rgba(228,0,43,0.10);
  --accent-glow:rgba(228,0,43,0.25);
  --agent:      #0072CE;
  --agent-bg:   rgba(0,114,206,0.10);
  --online:     #00A651;
  --warning:    #FFD100;
  --danger:     #E4002B;
  --sidebar-w:  256px;
  --sidebar-bg: #3A3226;
  --brown:      #3A3226;
  --brown-mid:  #6B5E4F;
  --brown-light:#8B7E6F;
  --text-light: #F5F0E8;
  --orange:     #FF6900;
  --blue:       #0072CE;
  --green:      #00A651;
  --shadow:     rgba(58,50,38,0.08);
  --shadow-2:   rgba(58,50,38,0.15);
  --rainbow:    linear-gradient(90deg, #E4002B 0%, #E4002B 20%, #FF6900 20%, #FF6900 40%, #FFD100 40%, #FFD100 60%, #00A651 60%, #00A651 80%, #0072CE 80%, #0072CE 100%);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Outfit',-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Film grain overlay */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:9999;
  mix-blend-mode:multiply;
}

/* Rainbow top stripe */
.rainbow-bar {
  height:5px;
  background:var(--rainbow);
  flex-shrink:0;
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--brown-mid)}

/* ════════════════════════════════════════
   LANDING PAGE
════════════════════════════════════════ */
#landing {
  display:none;
  min-height:100vh;
  background:var(--bg);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

#landing::before {
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(228,0,43,0.06) 0%, transparent 70%);
  pointer-events:none;
}

#landing::after {
  content:'';
  position:absolute;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
}

.landing-card {
  position:relative;
  z-index:1;
  background:var(--surface);
  border:1px solid var(--border-2);
  border-radius:16px;
  padding:40px;
  width:100%;
  max-width:380px;
  margin:0 16px;
  box-shadow:0 0 0 1px var(--shadow), 0 32px 64px var(--shadow-2);
  animation:cardIn .4s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardIn {
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.landing-mark {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:40px;height:40px;
  background:var(--accent-bg);
  border:1px solid var(--accent-glow);
  border-radius:10px;
  margin-bottom:16px;
}

.landing-mark svg {
  width:20px;height:20px;
  fill:var(--accent);
}

.landing-logo {
  font-family:'Libre Baskerville',serif;
  font-size:24px;
  font-weight:700;
  letter-spacing:-.02em;
  margin-bottom:4px;
  color:var(--brown);
}

.landing-sub {
  font-size:13px;
  color:var(--text-muted);
  margin-bottom:28px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.02em;
}

/* auth tabs */
.auth-tabs {
  display:flex;
  gap:0;
  border-bottom:1px solid var(--border);
  margin-bottom:24px;
}

.auth-tab {
  flex:1;
  padding:8px 4px;
  font-size:13px;
  font-family:'Outfit',sans-serif;
  font-weight:500;
  cursor:pointer;
  color:var(--text-muted);
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .15s, border-color .15s;
}

.auth-tab.active {
  color:var(--accent);
  border-bottom-color:var(--accent);
}

/* auth form */
.auth-form {
  display:flex;
  flex-direction:column;
  gap:14px;
}

.auth-field {
  display:flex;
  flex-direction:column;
  gap:5px;
}

.auth-label {
  font-size:11px;
  font-weight:500;
  color:var(--text-muted);
  letter-spacing:.06em;
  text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;
}

.auth-input {
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  padding:10px 12px;
  font-size:14px;
  font-family:'Outfit',sans-serif;
  outline:none;
  width:100%;
  transition:border-color .15s, box-shadow .15s;
}

.auth-input:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-bg);
}

.auth-input::placeholder{color:var(--text-dim)}

.auth-error {
  font-size:12px;
  color:var(--danger);
  min-height:16px;
  font-family:'IBM Plex Mono',monospace;
}

.auth-submit {
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:11px;
  font-size:14px;
  font-weight:600;
  font-family:'Outfit',sans-serif;
  cursor:pointer;
  width:100%;
  transition:opacity .15s, transform .1s;
  margin-top:2px;
  box-shadow:0 2px 8px rgba(228,0,43,0.3);
}

.auth-submit:hover{opacity:.9}
.auth-submit:active{transform:scale(.99)}
.auth-submit:disabled{opacity:.4;cursor:default}

.auth-divider {
  display:flex;
  align-items:center;
  gap:10px;
  margin:4px 0;
}

.auth-divider::before,
.auth-divider::after {
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}

.auth-divider span {
  font-size:11px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
}

.feishu-btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:transparent;
  color:var(--text-muted);
  border:1px solid var(--border-2);
  border-radius:8px;
  padding:10px;
  font-size:13px;
  font-family:'Outfit',sans-serif;
  font-weight:500;
  cursor:pointer;
  text-decoration:none;
  transition:border-color .15s, color .15s, background .15s;
}

.feishu-btn:hover {
  border-color:var(--accent-glow);
  color:var(--text);
  background:var(--accent-bg);
}
.guest-btn {
  display:block; width:100%; padding:10px; border:none; border-radius:8px; cursor:pointer;
  background:var(--accent); color:#fff; font-size:0.95rem; font-weight:600;
  transition:opacity .15s;
}
.guest-btn:hover { opacity:.85; }

/* Guest trial badge — inline in team header */
#guest-bar {
  display:none; font-size:11px; color:var(--text-muted); margin-left:auto;
  font-family:'IBM Plex Mono',monospace;
}
#guest-bar .remaining { color:var(--accent); font-weight:700; }
#guest-bar .register-link { color:var(--accent); cursor:pointer; text-decoration:underline; margin-left:6px; font-size:11px; }

/* Guest register modal */
#guest-register-modal {
  display:none; position:fixed; inset:0; z-index:1000;
  align-items:center; justify-content:center;
}
#guest-register-modal .modal-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,.6);
}

/* ════════════════════════════════════════
   APP SHELL
════════════════════════════════════════ */
#app {
  display:flex;
  flex:1;
  overflow:hidden;
}

/* ── SIDEBAR ── */
#sidebar {
  width:var(--sidebar-w);
  background:var(--sidebar-bg);
  color:var(--text-light);
  border-right:4px solid;
  border-image:var(--rainbow) 1;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  overflow:hidden;
  position:relative;
}

#sidebar::after {
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:4px;
  background:var(--rainbow);
}

#sidebar-header {
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(245,240,232,0.1);
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
}

.sidebar-logo-mark {
  width:30px;height:30px;
  background:var(--surface);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
}

.sidebar-logo-mark svg{width:14px;height:14px;fill:var(--accent)}

.sidebar-logo-text {
  font-family:'Libre Baskerville',serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--surface);
}

/* ── Sidebar mode tabs ── */
#sidebar-mode-tabs {
  display:flex;
  padding:6px 8px 2px;
  gap:3px;
  flex-shrink:0;
  border-bottom:1px solid rgba(245,240,232,0.08);
}

.sidebar-mode-btn {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:6px 4px;
  border:none;
  background:none;
  color:rgba(245,240,232,0.4);
  cursor:pointer;
  border-radius:8px;
  font-size:11.5px;
  font-family:'Outfit',sans-serif;
  font-weight:500;
  transition:all .15s;
}

.sidebar-mode-btn svg { flex-shrink:0; }
.sidebar-mode-btn:hover { color:rgba(245,240,232,0.75); background:rgba(245,240,232,0.07); }
.sidebar-mode-btn.active { color:var(--surface); background:rgba(245,240,232,0.13); }

#sidebar-chat, #sidebar-members {
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
}

.sidebar-body {
  flex:1;
  overflow-y:auto;
  padding:8px 0;
  display:flex;
  flex-direction:column;
}

.sidebar-section {
  padding:4px 0 2px;
}

.sidebar-label {
  padding:6px 16px 4px;
  font-size:10px;
  font-weight:600;
  color:var(--brown-light);
  text-transform:uppercase;
  letter-spacing:.1em;
  font-family:'IBM Plex Mono',monospace;
}

/* team / dm items */
.team-item {
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 12px 7px 14px;
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
  color:rgba(245,240,232,0.55);
  border-radius:10px;
  transition:all .2s cubic-bezier(.16,1,.3,1);
  margin:1px 6px;
  position:relative;
}

.team-item:hover {
  color:var(--surface);
  background:rgba(245,240,232,0.08);
}

.team-item.active {
  color:#fff;
  background:var(--accent);
  box-shadow:0 2px 12px rgba(228,0,43,0.35);
}

.team-item .ch-prefix {
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:inherit;
  opacity:.4;
  flex-shrink:0;
}

.team-item.active .ch-prefix { opacity:1; }

.team-item .badge {
  margin-left:auto;
  background:var(--accent);
  color:#fff;
  border-radius:99px;
  font-size:10px;
  padding:2px 7px;
  font-weight:700;
  font-family:'IBM Plex Mono',monospace;
}

.team-item.active .badge {
  background:rgba(255,255,255,0.25);
}

/* machine items */
.machine-item {
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 12px 7px 14px;
  font-size:12.5px;
  color:rgba(245,240,232,0.55);
  border-radius:10px;
  margin:1px 6px;
  transition:all .2s cubic-bezier(.16,1,.3,1);
  cursor:default;
}
.machine-item:hover {
  color:var(--surface);
  background:rgba(245,240,232,0.08);
}
.team-item:hover .del-btn { opacity:0.5!important; }
.team-item:hover .del-btn:hover { opacity:1!important; color:var(--accent)!important; }

/* agent items */
.agent-item {
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 12px 7px 14px;
  font-size:13px;
  color:rgba(245,240,232,0.55);
  border-radius:10px;
  margin:1px 6px;
  transition:all .2s cubic-bezier(.16,1,.3,1);
}

.agent-item:hover {
  color:var(--surface);
  background:rgba(245,240,232,0.08);
}

/* status dots */
.dot {
  width:7px;height:7px;
  border-radius:50%;
  flex-shrink:0;
}

.dot-active   { background:var(--online); box-shadow:0 0 6px var(--online) }
.dot-working  { background:var(--warning); box-shadow:0 0 6px var(--warning); animation:pulse 1.2s ease-in-out infinite }
.dot-inactive { background:var(--text-dim) }

@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(.85)}
}

/* add button */
.add-btn {
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 16px;
  background:none;
  border:none;
  color:var(--brown-light);
  cursor:pointer;
  font-size:12px;
  font-family:'Outfit',sans-serif;
  width:100%;
  text-align:left;
  transition:color .1s;
}

.add-btn:hover{color:var(--surface)}

/* user badge */
#user-badge {
  padding:10px 12px;
  border-top:1px solid rgba(245,240,232,0.1);
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.user-avatar {
  width:28px;height:28px;
  border-radius:50%;
  background:var(--brown-mid);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  font-weight:700;
  color:#fff;
  flex-shrink:0;
  font-family:'Libre Baskerville',serif;
}



#settings-btn {
  background:none;border:none;color:var(--brown-light);cursor:pointer;
  padding:4px;border-radius:4px;font-size:28px;line-height:1;
  margin-left:auto;
}
#settings-btn:hover{color:var(--surface);background:rgba(245,240,232,.1)}

.settings-overlay {
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.2);z-index:9998;
  backdrop-filter:blur(6px);
}
.settings-panel {
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--surface);border:1px solid var(--border-2);border-radius:20px;
  padding:24px;min-width:380px;max-width:480px;z-index:9999;
  box-shadow:0 8px 32px rgba(0,0,0,.1);
}
.settings-panel h3 { margin:0 0 16px; font-size:16px; }
.identity-item {
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface-2);border-radius:8px;margin-bottom:8px;
}
.identity-item .provider-badge {
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;
  text-transform:uppercase;
}
.identity-item .provider-badge.feishu { background:#4f46e5;color:#fff; }
.identity-item .provider-badge.password { background:#059669;color:#fff; }
.identity-item .uid { flex:1;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis; }
.identity-item .unlink-btn {
  background:none;border:1px solid var(--border);color:var(--text-muted);
  padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer;
}
.identity-item .unlink-btn:hover { color:var(--danger);border-color:var(--danger); }
.identity-item .unlink-btn:disabled { opacity:.4;cursor:not-allowed; }
.settings-actions { display:flex;gap:8px;margin-top:14px; }
.settings-actions button {
  flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface-2);color:var(--text);font-size:12px;cursor:pointer;
}
.settings-actions button:hover { border-color:var(--accent);color:var(--accent); }
.link-pw-form { margin-top:12px;display:flex;flex-direction:column;gap:8px; }
.link-pw-form input {
  padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:13px;
}
.link-pw-form .form-row { display:flex;gap:8px; }
.link-pw-form .form-row button {
  padding:8px 16px;border:none;border-radius:6px;
  background:var(--accent);color:#fff;font-size:12px;cursor:pointer;
}

/* ── MAIN ── */
#main {
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--surface);
}

#team-header {
  padding:13px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

#team-name {
  font-size:14px;
  font-weight:700;
  color:var(--brown);
  font-family:'Libre Baskerville',serif;
  letter-spacing:-.01em;
}

#team-desc {
  font-size:12px;
  color:var(--text-dim);
  font-weight:400;
  font-family:'IBM Plex Mono',monospace;
}

/* tabs */
#tabs {
  display:flex;
  gap:0;
  border-bottom:1px solid var(--border);
  padding:0 20px;
  flex-shrink:0;
}

.tab {
  padding:9px 14px;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  color:var(--text-muted);
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .15s, border-color .15s;
}

.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* messages pane */
#messages-pane {
  flex:1;
  overflow-y:auto;
  padding:12px 0;
  display:flex;
  flex-direction:column;
  gap:0;
}

/* tasks pane */
#tasks-pane {
  flex:1;
  overflow-y:auto;
  padding:16px 20px;
  display:none;
  flex-direction:column;
  gap:8px;
}

/* files pane */
#files-pane {
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:none;
  flex-direction:column;
  gap:20px;
}
.files-section { display:flex; flex-direction:column; gap:10px; }
.files-section-title {
  font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
  display:flex; align-items:center; justify-content:space-between;
}
.brief-editor {
  width:100%; min-height:120px; padding:12px 14px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-family:'IBM Plex Mono',monospace;
  font-size:12px; line-height:1.6; resize:vertical; box-sizing:border-box;
  transition:border-color .15s;
}
.brief-editor:focus { outline:none; border-color:var(--accent); }
.brief-save-btn {
  align-self:flex-end; padding:5px 14px; font-size:12px; font-weight:600;
  background:var(--accent); color:#fff; border:none; border-radius:6px;
  cursor:pointer; transition:opacity .15s;
}
.brief-save-btn:hover { opacity:.85; }
.brief-save-btn:disabled { opacity:.5; cursor:default; }
.files-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;
}
.file-card {
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  overflow:hidden; cursor:pointer; transition:border-color .15s, box-shadow .15s;
  text-decoration:none; color:inherit;
  display:flex; flex-direction:column;
  position:relative;
}
.file-card:hover { border-color:var(--border-2); box-shadow:0 2px 8px var(--shadow); }
.file-card-link {
  display:flex;
  flex-direction:column;
  text-decoration:none;
  color:inherit;
  min-height:100%;
}
.file-card-menu-btn {
  position:absolute;
  top:6px;
  right:6px;
  width:26px;
  height:26px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:6px;
  background:rgba(255,255,255,.88);
  color:var(--text-muted);
  cursor:pointer;
  font-size:16px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}
.file-card-menu-btn:hover { color:var(--text); background:var(--surface); }
.file-card-menu {
  position:absolute;
  top:34px;
  right:6px;
  min-width:92px;
  padding:4px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  box-shadow:0 8px 24px var(--shadow);
  z-index:5;
  display:none;
}
.file-card-menu.open { display:block; }
.file-card-menu-item {
  width:100%;
  border:none;
  border-radius:6px;
  background:none;
  padding:7px 10px;
  color:var(--danger);
  cursor:pointer;
  font-size:12px;
  text-align:left;
  font-family:'Outfit',sans-serif;
}
.file-card-menu-item:hover { background:rgba(220,53,69,.08); }
.file-card-thumb {
  width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--surface-3);
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
}
.file-card-thumb img { width:100%; height:100%; object-fit:cover; }
.file-card-info { padding:8px 10px; }
.file-card-name { font-size:11px; font-weight:500; color:var(--text); word-break:break-all; line-height:1.4; }
.file-card-meta { font-size:10px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; margin-top:2px; }
.knowledge-view {
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding:14px; font-family:'IBM Plex Mono',monospace; font-size:12px;
  line-height:1.7; color:var(--text-muted); white-space:pre-wrap;
  max-height:300px; overflow-y:auto;
}
.files-empty { font-size:12px; color:var(--text-dim); font-style:italic; padding:8px 0; }

/* message */
.msg {
  display:flex;
  gap:10px;
  padding:5px 20px;
  transition:background .1s;
}

.msg:hover{background:rgba(58,50,38,0.04);border-radius:12px}

.msg-avatar {
  width:34px;height:34px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  font-weight:700;
  color:#fff;
  font-family:'Libre Baskerville',serif;
  margin-top:2px;
  position:relative;
  box-shadow:0 2px 8px var(--shadow-2);
}

.msg-avatar.is-agent {
  background:var(--blue);
}

.msg-avatar.is-human {
  background:var(--brown);
}

/* Polaroid-style white border on avatars */
.msg-avatar::before {
  content:'';
  position:absolute;
  inset:-3px;
  border-radius:calc(50% + 3px);
  border:2px solid rgba(255,255,255,0.7);
  box-shadow:0 1px 4px var(--shadow);
}

.msg-body{flex:1;min-width:0}

.msg-header {
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-bottom:3px;
}

.msg-name {
  font-size:13.5px;
  font-weight:600;
  color:var(--text);
}

.msg-name.agent{color:var(--blue)}

.msg-time {
  font-size:10.5px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
}

.msg-badge {
  font-size:9.5px;
  padding:1px 6px;
  border-radius:4px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
}

.msg-content {
  font-size:14px;
  color:var(--text);
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
}

.mention {
  background:var(--accent-bg);
  color:var(--accent);
  font-weight:500;
  padding:1px 4px;
  border-radius:4px;
  cursor:default;
}

.mention.mention-me {
  background:rgba(228,0,43,0.18);
  color:var(--accent);
  font-weight:600;
}

#mention-popup {
  display:none;
  position:absolute;
  bottom:100%;
  left:8px;
  right:8px;
  background:var(--surface);
  border:1px solid var(--border-2);
  border-radius:10px;
  padding:4px 0;
  max-height:220px;
  overflow-y:auto;
  z-index:100;
  box-shadow:0 -4px 20px rgba(0,0,0,.08);
  margin-bottom:2px;
}

.mention-item {
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  cursor:pointer;
  font-size:13px;
  color:var(--text);
  transition:background .1s;
}

.mention-item:hover, .mention-item.active {
  background:var(--accent-bg);
}

.mention-item .mi-avatar {
  width:22px;
  height:22px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:600;
  color:#fff;
  flex-shrink:0;
}

.mention-item .mi-avatar.is-agent { background:var(--agent); }
.mention-item .mi-avatar.is-human { background:var(--accent); }

.mention-item .mi-info { flex:1;min-width:0; }
.mention-item .mi-name { font-weight:500; }
.mention-item .mi-handle { color:var(--text-dim);font-size:11px;margin-left:4px; }

.msg-content.system {
  color:var(--text-dim);
  font-style:italic;
  font-size:12.5px;
  font-family:'IBM Plex Mono',monospace;
}

.msg-system-notify {
  text-align:center;
  padding:4px 20px;
  font-size:11.5px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
  opacity:.8;
}

/* ── Platform connection cards ── */
.platform-card {
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:8px;
  background:var(--surface);
  transition:border-color .15s;
}
.platform-card-connected { border-color:var(--green); background:rgba(0,166,81,.04); }
.platform-card-disabled  { opacity:.55; }
.platform-card-icon { font-size:22px; width:32px; text-align:center; flex-shrink:0; }
.platform-card-info { flex:1; min-width:0; }
.platform-card-name { font-weight:600; font-size:14px; }
.platform-card-account { font-size:12px; color:var(--text-muted); margin-top:2px; }
.platform-card-status {
  font-size:11px;
  color:var(--green);
  font-family:'IBM Plex Mono',monospace;
  white-space:nowrap;
}
.platform-connect-btn {
  padding:7px 16px;
  border-radius:6px;
  background:var(--accent);
  color:#fff;
  border:none;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  font-family:'Outfit',sans-serif;
  white-space:nowrap;
  transition:opacity .15s;
}
.platform-connect-btn:hover { opacity:.85; }
.platform-card-manage-btn {
  font-size:11px;
  padding:3px 8px;
  border-radius:5px;
  border:1px solid var(--border-2);
  background:none;
  cursor:pointer;
  font-family:'Outfit',sans-serif;
  color:var(--text-muted);
}
.platform-card-disconnect-btn {
  font-size:11px;
  padding:3px 8px;
  border-radius:5px;
  border:1px solid transparent;
  background:none;
  cursor:pointer;
  font-family:'Outfit',sans-serif;
  color:var(--text-dim);
  transition:color .1s;
}
.platform-card-disconnect-btn:hover { color:var(--danger); }

/* ── Action approval card ── */
.msg-action-card {
  margin:8px 16px;
  background:var(--surface);
  border:1.5px solid var(--border-2);
  border-left:4px solid var(--orange);
  border-radius:8px;
  padding:14px 16px;
  font-size:13.5px;
}
.msg-action-card.status-approved { border-left-color:var(--green); }
.msg-action-card.status-rejected { border-left-color:var(--text-dim); opacity:.7; }
.msg-action-card.status-executed { border-left-color:var(--blue); }
.action-card-header {
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.action-card-icon { font-size:16px; }
.action-card-title {
  font-weight:600;
  color:var(--text);
  flex:1;
}
.action-card-badge {
  font-size:11px;
  padding:2px 8px;
  border-radius:20px;
  font-family:'IBM Plex Mono',monospace;
  background:rgba(255,105,0,.12);
  color:var(--orange);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.action-card-badge.approved { background:rgba(0,166,81,.12); color:var(--green); }
.action-card-badge.rejected { background:rgba(0,0,0,.06); color:var(--text-dim); }
.action-card-badge.executed { background:rgba(0,114,206,.12); color:var(--blue); }
.action-card-meta {
  font-size:12px;
  color:var(--text-muted);
  margin-bottom:8px;
}
.action-card-desc {
  color:var(--text);
  margin-bottom:12px;
  line-height:1.5;
}
.action-card-payload {
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:0;
  color:var(--text-muted);
  margin-bottom:12px;
}
.action-card-payload summary {
  cursor:pointer;
  padding:9px 12px;
  font-size:12px;
  font-weight:600;
  color:var(--text);
}
.action-card-payload-body {
  border-top:1px solid var(--border);
  padding:10px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.action-payload-field {
  display:flex;
  flex-direction:column;
  gap:4px;
}
.action-payload-label {
  font-size:10px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.action-payload-value {
  font-size:12.5px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  color:var(--text-muted);
}
.action-payload-json {
  margin:0;
  font-size:12px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  color:var(--text-muted);
  font-family:'IBM Plex Mono',monospace;
}
.action-card-btns { display:flex; gap:8px; }
.action-approve-btn {
  background:var(--green);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:7px 20px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:opacity .15s;
}
.action-approve-btn:hover { opacity:.85; }
.action-reject-btn {
  background:var(--surface-2);
  color:var(--text-muted);
  border:1px solid var(--border-2);
  border-radius:6px;
  padding:7px 16px;
  font-size:13px;
  cursor:pointer;
  transition:opacity .15s;
}
.action-reject-btn:hover { opacity:.7; }
.action-executing-hint { font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:4px; }

/* message hover actions */
.msg-actions-hover {
  display:none;
  position:absolute;
  right:8px;
  top:4px;
}

.msg:hover .msg-actions-hover { display:flex; gap:2px }
.msg { position:relative }

.msg-action-btn {
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:4px;
  padding:2px 6px;
  font-size:12px;
  cursor:pointer;
  opacity:.7;
  transition:opacity .15s;
}

.msg-action-btn:hover { opacity:1; border-color:var(--accent) }

/* day separator */
.day-sep {
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 20px;
  font-size:11px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
}

.day-sep::before,.day-sep::after{
  content:'';flex:1;height:1px;background:var(--border);
}

/* task cards */
.task-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  transition:all .2s;
}

.task-card:hover{border-color:var(--border-2);box-shadow:0 4px 16px rgba(0,0,0,0.04);transform:translateY(-1px)}

.task-status {
  font-size:10px;
  padding:2px 8px;
  border-radius:5px;
  font-weight:600;
  flex-shrink:0;
  margin-top:1px;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.03em;
  text-transform:uppercase;
}

.status-open,
.status-todo        { background:rgba(255,209,0,.10); color:#d97706 }
.status-in_progress { background:rgba(0,114,206,.10);  color:var(--blue) }
.status-in_review   { background:rgba(255,209,0,.10);  color:var(--warning) }
.status-done        { background:rgba(0,166,81,.10);  color:var(--green) }
.status-cancelled   { background:var(--surface-2);     color:var(--text-dim);text-decoration:line-through }

/* task filter bar */
.task-filter-bar {
  display:flex;
  gap:6px;
  margin-bottom:12px;
  flex-wrap:wrap;
  flex-shrink:0;
}

.task-filter-pill {
  font-size:11px;
  padding:4px 12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:none;
  color:var(--text-muted);
  cursor:pointer;
  font-family:'Outfit',sans-serif;
  transition:all .15s;
}

.task-filter-pill:hover { border-color:var(--border-2); color:var(--text) }
.task-filter-pill.active { background:var(--accent-bg); border-color:var(--accent); color:var(--accent) }

.task-filter-pill .pill-count {
  font-size:10px;
  margin-left:4px;
  opacity:.7;
  font-family:'IBM Plex Mono',monospace;
}

/* task delete button */
.task-btn.task-btn-danger:hover { border-color:var(--accent); color:var(--accent); background:rgba(228,0,43,.08) }

/* as-task toggle in composer */
.as-task-toggle {
  display:flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  color:var(--text-muted);
  cursor:pointer;
  padding:0 6px;
  white-space:nowrap;
  user-select:none;
}

.as-task-toggle input { accent-color:var(--accent); width:13px; height:13px; cursor:pointer }

.task-body{flex:1;min-width:0}
.task-title{font-size:13.5px;color:var(--text);margin-bottom:4px;line-height:1.4}
.task-meta{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace}

.task-actions{display:flex;gap:4px;margin-top:8px}

.task-btn {
  font-size:11px;
  padding:3px 10px;
  border-radius:5px;
  border:1px solid var(--border-2);
  background:none;
  color:var(--text-muted);
  cursor:pointer;
  font-family:'Outfit',sans-serif;
  transition:color .1s, border-color .1s, background .1s;
}

.task-btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-bg)}

/* ── INPUT AREA ── */
#input-area {
  padding:12px 20px 16px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}

.composer {
  background:var(--surface);
  border:1.5px solid var(--border-2);
  border-radius:14px;
  transition:border-color .2s, box-shadow .2s;
  position:relative;
}

.composer:focus-within {
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(228,0,43,0.10);
}

#input-row{display:flex;gap:0;align-items:flex-end;position:relative}

#msg-input {
  flex:1;
  background:transparent;
  border:none;
  color:var(--text);
  padding:10px 14px;
  font-size:13.5px;
  resize:none;
  min-height:40px;
  max-height:120px;
  font-family:'Outfit',sans-serif;
  outline:none;
  line-height:1.5;
}

#msg-input::placeholder{color:var(--text-dim)}

#send-btn {
  background:var(--accent);
  color:#fff;
  border:none;
  padding:8px 16px;
  cursor:pointer;
  font-size:12px;
  font-family:'Outfit',sans-serif;
  font-weight:600;
  white-space:nowrap;
  flex-shrink:0;
  transition:all .2s;
  height:36px;
  align-self:flex-end;
  border-radius:8px;
  margin:2px 4px 2px 0;
  box-shadow:0 2px 8px rgba(228,0,43,0.3);
}

#send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(228,0,43,0.4)}
#send-btn:disabled{opacity:.3;cursor:default}

#task-input-row {
  display:none;
  gap:8px;
  align-items:center;
  margin-top:8px;
}

#new-task-btn {
  flex:1;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text-muted);
  padding:8px 12px;
  font-size:13px;
  font-family:'Outfit',sans-serif;
  cursor:pointer;
  transition:border-color .15s, color .15s;
  text-align:left;
}

#new-task-btn:hover { border-color:var(--accent); color:var(--accent) }

#task-content:focus{border-color:var(--accent)}
#task-content::placeholder{color:var(--text-dim)}

#create-task-btn {
  background:rgba(0,166,81,.1);
  color:var(--online);
  border:1px solid rgba(0,166,81,.2);
  border-radius:6px;
  padding:7px 14px;
  cursor:pointer;
  font-size:12.5px;
  font-family:'Outfit',sans-serif;
  flex-shrink:0;
  transition:background .15s;
}

#create-task-btn:hover{background:rgba(0,166,81,.18)}

/* ── CONN BADGE ── */
#conn-badge {
  font-size:9.5px;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.04em;
  white-space:nowrap;
  margin-left:auto;
  flex-shrink:0;
}

#conn-badge.connected  { color:var(--online); }
#conn-badge.disconnected{ color:var(--brown-light); }

/* ── EMPTY STATE ── */
.empty-state {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  gap:10px;
  padding:40px 24px;
  text-align:center;
}

.empty-icon {
  width:56px;height:56px;
  border-radius:50%;
  background:linear-gradient(135deg, rgba(228,0,43,0.08), rgba(255,105,0,0.08));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  margin-bottom:6px;
}

.empty-state h3 {
  font-family:'Libre Baskerville',serif;
  font-size:18px;
  font-weight:700;
  color:var(--brown);
  letter-spacing:-.02em;
}

.empty-state p {
  font-size:13.5px;
  color:var(--text-muted);
  max-width:340px;
  line-height:1.6;
}

.empty-actions {
  display:flex;
  gap:8px;
  margin-top:6px;
  flex-wrap:wrap;
  justify-content:center;
}

.btn-primary {
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:7px;
  padding:9px 18px;
  font-size:13px;
  font-weight:600;
  font-family:'Outfit',sans-serif;
  cursor:pointer;
  transition:opacity .15s;
  box-shadow:0 2px 8px rgba(228,0,43,0.3);
}

.btn-primary:hover{opacity:.88}

.btn-secondary {
  background:none;
  color:var(--text-muted);
  border:1px solid var(--border-2);
  border-radius:7px;
  padding:9px 18px;
  font-size:13px;
  font-family:'Outfit',sans-serif;
  cursor:pointer;
  transition:color .15s, border-color .15s;
}

.btn-secondary:hover{color:var(--text);border-color:var(--accent)}

.empty-guide {
  margin-top:20px;
  padding:16px 20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  text-align:left;
  max-width:340px;
  width:100%;
}

.empty-guide-title {
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
  letter-spacing:.08em;
  text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;
  margin-bottom:10px;
}

.empty-guide-steps {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.empty-guide-step {
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:12.5px;
  color:var(--text-muted);
}

.step-num {
  width:18px;height:18px;
  border-radius:5px;
  background:var(--accent-bg);
  border:1px solid var(--accent-glow);
  color:var(--accent);
  font-size:10px;
  font-weight:700;
  font-family:'IBM Plex Mono',monospace;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  margin-top:1px;
}

/* ── AGENTS section with flex growth ── */
.sidebar-agents-section {
  flex:1;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:0;

  overflow-y:auto;
  flex:1;
}

.section-header-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 12px 4px 16px;
}

.section-header-row .sidebar-label{padding:0}

.inline-add-btn {
  background:none;
  border:none;
  color:var(--brown-light);
  cursor:pointer;
  font-size:13px;
  width:20px;height:20px;

@keyframes msgIn {
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── Machine Key Modal ── */
.key-modal-overlay {
  position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
.key-modal {
  background:var(--surface);border:1px solid var(--border-2);border-radius:20px;

.key-modal h3 {

  position:relative;
}
.key-modal-copy {
  margin-top:12px;display:flex;gap:8px;justify-content:flex-end;

  font-size:13px;font-family:'Libre Baskerville',serif;font-weight:600;
}
.btn-copy-cmd { background:var(--accent);color:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(228,0,43,0.3); }
.btn-close-modal { background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)!important;border-radius:10px; }
</style>
</head>
<body>
<div class="rainbow-bar"></div>

<!-- ══ LANDING ══ -->
<div id="landing" style="display:none">
  <div class="landing-card">
    <div class="landing-mark">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>

    <div id="login-form" class="auth-form">

    <div id="register-form" class="auth-form" style="display:none">

        <input class="auth-input" id="reg-name" placeholder="显示名称">
      </div>
      <div class="auth-field">
        <label class="auth-label">用户名</label>
        <input class="auth-input" id="reg-username" placeholder="your_username" autocomplete="username">
      </div>
      <div class="auth-field">
        <label class="auth-label">密码 <span style="color:var(--text-dim)">(至少 6 位)</span></label>
        <input class="auth-input" id="reg-password" placeholder="••••••••" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitRegister()">
      </div>
      <div class="auth-error" id="reg-error"></div>
      <button class="auth-submit" onclick="submitRegister()">创建账号</button>
    </div>

    <div class="auth-divider"><span>or</span></div>
    <a class="feishu-btn" href="/api/auth/feishu">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      使用飞书登录
    </a>
    <div class="auth-divider"><span>or</span></div>
    <button class="guest-btn" onclick="startGuestTrial()">免费试用，无需注册</button>
  </div>
</div>

<!-- ══ GUEST REGISTER MODAL ══ -->
<div id="guest-register-modal" style="display:none">
  <div class="modal-overlay" onclick="closeGuestRegister()"></div>
  <div class="landing-card" style="position:relative;z-index:1001;max-width:400px">
    <div class="landing-mark">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div class="landing-logo" style="font-size:1.2rem">注册解锁完整功能</div>
    <div class="landing-sub" style="margin-bottom:16px">
      创建多个 Agent · 自定义能力 · 团队协作 · 无限消息
    </div>
    <div class="auth-field">
      <label class="auth-label">用户名</label>
      <input class="auth-input" id="guest-reg-username" placeholder="your_username" autocomplete="username">
    </div>
    <div class="auth-field">
      <label class="auth-label">密码 <span style="color:var(--text-dim)">(至少 6 位)</span></label>
      <input class="auth-input" id="guest-reg-password" placeholder="••••••••" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitGuestRegister()">
    </div>
    <div class="auth-error" id="guest-reg-error"></div>
    <button class="auth-submit" onclick="submitGuestRegister()">创建账号</button>
    <div class="auth-divider"><span>or</span></div>
    <a class="feishu-btn" href="/api/auth/feishu">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      使用飞书登录
    </a>
    <button class="guest-dismiss" onclick="closeGuestRegister()" style="margin-top:8px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.8rem">稍后再说</button>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" style="display:none">
  <div id="sidebar">
    <div id="sidebar-header">
      <div class="sidebar-logo-mark">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <span class="sidebar-logo-text">lightcone</span>
    </div>

    <div id="sidebar-mode-tabs">
      <button class="sidebar-mode-btn active" data-mode="chat" onclick="setSidebarMode('chat')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        团队
      </button>
      <button class="sidebar-mode-btn" data-mode="members" onclick="setSidebarMode('members')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        成员
      </button>
    </div>

    <div class="sidebar-body">
      <div id="sidebar-chat">
        <div class="sidebar-section">
          <div class="section-header-row">
            <div class="sidebar-label">Workspaces</div>
            <button class="inline-add-btn" onclick="showNewWorkspace()" title="创建 workspace">＋</button>
          </div>
          <div id="team-list"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-header-row">
            <div class="sidebar-label">Channels</div>
            <button class="inline-add-btn" onclick="showNewChannel()" title="创建 channel">＋</button>
          </div>
          <div id="dm-list"></div>
        </div>
      </div>

      <div id="sidebar-members" style="display:none">
        <div class="sidebar-section">
          <div class="section-header-row">
            <div class="sidebar-label">机器</div>
            <button class="inline-add-btn" onclick="showNewMachine()" title="添加机器">＋</button>
          </div>
          <div id="machine-list"></div>
        </div>

        <div class="sidebar-agents-section">
          <div class="section-header-row">
            <div class="sidebar-label">Agent</div>
            <button class="inline-add-btn" onclick="showNewAgent()" title="创建 Agent">＋</button>
          </div>
          <div class="agent-scroll">
            <div id="agent-list"></div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-header-row">
            <div class="sidebar-label">Skills</div>
            <button class="inline-add-btn" onclick="openSkillsPanel()" title="管理 Skills">＋</button>
          </div>
        </div>
      </div>

      <div class="sidebar-section" id="plan-section" style="margin-top:auto;display:none">
        <div id="plan-info"></div>
      </div>
    </div>

    <div id="user-badge">
      <div class="user-avatar" id="user-avatar" onclick="openSettings()" style="cursor:pointer" title="账号设置">?</div>
      <button id="settings-btn" onclick="openSettings()" title="账号设置">⚙</button>
    </div>
  </div>

  <div id="main"></div>
</div>

<script>
const API = '';
let currentTeam = null;
let currentWorkspace = null;
let currentTab = 'messages';

function setSidebarMode(mode) {
  document.getElementById('sidebar-chat').style.display    = mode === 'chat'    ? 'flex' : 'none';
  document.getElementById('sidebar-members').style.display = mode === 'members' ? 'flex' : 'none';
  document.querySelectorAll('.sidebar-mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode)
  );
}
let socket = null;
let teams = [], dms = [], workspaces = [], workspaceChannels = [], agents = [], machines = [];
let currentTeamMembers = { agents: [], humans: [] };
let currentUser = null;
const messageCache = new Map(); // channelId → { msgs: [...], lastSeq: number }

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    currentUser = await api('/api/auth/me', { credentials: 'include' });
  } catch {
    document.getElementById('app').style.display = 'none';
    document.getElementById('landing').style.display = 'flex';
    return;
  }

  document.getElementById('app').style.display = 'flex';
  document.getElementById('landing').style.display = 'none';

  const name = currentUser.name || 'User';
  document.getElementById('user-avatar').textContent = currentUser.isGuest ? '访' : name[0].toUpperCase();

  await Promise.all([loadTeams(), loadDMs(), loadWorkspaces(), loadAgents(), loadMachines(), loadPlanInfo()]);
  setupSocket();
  checkOAuthCallback();

  restoreMain();
  await selectInitialTeam();

  // Show guest bar if guest user
  if (currentUser.isGuest) {
    const gb = document.getElementById('guest-bar');
    if (gb) gb.style.display = 'inline';
    updateGuestRemaining();
    // Hide plan info for guests
    const pi = document.getElementById('plan-info');
    if (pi) pi.style.display = 'none';
  }

  // Post-link feedback via URL params
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('linked')) {
    const linked = urlParams.get('linked');
    const merged = urlParams.get('merged') === 'true';
    if (linked === 'already') showToast('该飞书账号已经关联');
    else if (merged) showToast('飞书账号已关联，原账号资源已自动合并');
    else showToast('飞书账号关联成功');
    window.history.replaceState({}, '', '/');
  }
}

function showEmptyState() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🤖</div>
      <h3>还没有 Agent</h3>
      <p>创建一个 Agent，把对应的飞书机器人加入你的群，即可开始对话。</p>
      <div class="empty-actions">
        <button class="btn-primary" onclick="showNewAgent();restoreMain()">＋ 创建 Agent</button>
        <button class="btn-secondary" onclick="restoreMain()">先看看</button>
      </div>
      <div class="empty-guide">
        <div class="empty-guide-title">快速开始</div>
        <div class="empty-guide-steps">
          <div class="empty-guide-step">
            <div class="step-num">1</div>
            <span>在左侧点击 <b style="color:var(--text)">＋ 创建 Agent</b></span>
          </div>
          <div class="empty-guide-step">
            <div class="step-num">2</div>
            <span>在飞书群里添加对应机器人</span>
          </div>
          <div class="empty-guide-step">
            <div class="step-num">3</div>
            <span>在群里 @Agent 开始对话</span>
          </div>
        </div>
      </div>
    </div>`;
}

function restoreMain() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div id="team-header">
      <span id="team-name" style="font-family:'IBM Plex Mono',monospace;font-size:13px">选择频道</span>
      <span id="team-desc"></span>
      <span id="guest-bar">剩余 <span class="remaining" id="guest-remaining">20</span> 条 · <span class="register-link" onclick="showGuestRegister()">注册</span></span>
      <button id="team-agents-toggle" onclick="toggleTeamAgentsBar()" style="display:none;background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);margin-left:auto;white-space:nowrap"></button>
    </div>
    <div id="team-agents-bar" style="display:none;padding:8px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px 14px;background:var(--surface);flex-shrink:0"></div>
    <div id="tabs">
      <div class="tab active" onclick="switchTab('messages')">消息</div>
    </div>
    <div id="messages-pane"></div>
    <div id="tasks-pane" style="display:none"></div>
    <div id="files-pane" style="display:none"></div>
    <div id="input-area">
      <div class="composer">
        <div id="mention-popup"></div>
        <div id="input-row">
          <textarea id="msg-input" placeholder="发送消息…" rows="1" oninput="autoResize(this);checkMention(this)" onkeydown="handleKey(event)" oncompositionstart="setMessageComposing(true)" oncompositionend="setMessageComposing(false)"></textarea>
          <button id="send-btn" onclick="sendMessage()">发送 ↵</button>
        </div>
      </div>
    </div>`;
  renderCurrentTeamHeader();
  renderTeamAgentsBar();
}

async function selectInitialTeam() {
  const lastWorkspaceId = localStorage.getItem('lastWorkspaceId');
  const lastChannelId = localStorage.getItem('lastChannelId');
  const targetWorkspace = lastWorkspaceId && workspaces.find(w => w.id === lastWorkspaceId);
  const fallbackWorkspace = workspaces[0] ?? null;
  if (targetWorkspace || fallbackWorkspace) {
    await selectWorkspace((targetWorkspace ?? fallbackWorkspace).id, { preferredChannelId: lastChannelId });
    return;
  }
  currentWorkspace = null;
  currentTeam = null;
  currentTeamMembers = { agents: [], humans: [] };
  renderWorkspaces();
  renderWorkspaceChannels();
  renderCurrentTeamHeader();
  const pane = document.getElementById('messages-pane');
  if (pane) pane.innerHTML = `<div class="files-empty" style="padding:24px 20px">先创建一个 workspace，再创建 channel 开始协作。</div>`;
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  document.getElementById('app').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  currentUser = null;
}

// ── Auth forms ────────────────────────────────────────────────────────────────
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) =>
    t.classList.toggle('active', (tab === 'login' ? 0 : 1) === i));
  document.getElementById('login-form').style.display    = tab === 'login'    ? 'flex' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'flex' : 'none';
}

async function submitLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error; return; }
    currentUser = data.user;
    document.getElementById('landing').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('user-avatar').textContent = (currentUser.name[0] ?? 'U').toUpperCase();
    await Promise.all([loadTeams(), loadDMs(), loadWorkspaces(), loadAgents(), loadMachines(), loadPlanInfo()]);
    setupSocket();
    restoreMain();
    await selectInitialTeam();
  } catch { errEl.textContent = '网络错误，请重试'; }
}

async function submitRegister() {
  const name     = document.getElementById('reg-name').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('reg-error');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, name }),
    });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error; return; }
    currentUser = data.user;
    document.getElementById('landing').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('user-avatar').textContent = (currentUser.name[0] ?? 'U').toUpperCase();
    await Promise.all([loadTeams(), loadDMs(), loadWorkspaces(), loadAgents(), loadMachines(), loadPlanInfo()]);
    setupSocket();
    restoreMain();
    await selectInitialTeam();
  } catch { errEl.textContent = '网络错误，请重试'; }
}

// ── Guest trial ──────────────────────────────────────────────────────────────
let guestMessagesSent = 0;
const GUEST_MSG_LIMIT = 20;

async function startGuestTrial() {
  try {
    const r = await fetch('/api/auth/guest', { method: 'POST', credentials: 'include' });
    const data = await r.json();
    if (!r.ok) { alert(data.error); return; }
    currentUser = { id: data.user.id, name: data.user.name, isGuest: true };
    document.getElementById('landing').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('user-avatar').textContent = '访';
    await Promise.all([loadTeams(), loadDMs(), loadWorkspaces(), loadAgents(), loadMachines(), loadPlanInfo()]);
    setupSocket();
    restoreMain();
    await selectInitialTeam();
    const gb = document.getElementById('guest-bar');
    if (gb) gb.style.display = 'inline';
    updateGuestRemaining();
    const pi = document.getElementById('plan-info');
    if (pi) pi.style.display = 'none';
  } catch { alert('网络错误，请重试'); }
}

function updateGuestRemaining() {
  const el = document.getElementById('guest-remaining');
  if (el) el.textContent = Math.max(0, GUEST_MSG_LIMIT - guestMessagesSent);
}

function showGuestRegister() {
  const modal = document.getElementById('guest-register-modal');
  if (modal) modal.style.display = 'flex';
}

function closeGuestRegister() {
  const modal = document.getElementById('guest-register-modal');
  if (modal) modal.style.display = 'none';
}

async function submitGuestRegister() {
  const username = document.getElementById('guest-reg-username').value.trim();
  const password = document.getElementById('guest-reg-password').value;
  const errEl = document.getElementById('guest-reg-error');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, name: username }),
    });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error; return; }
    // Conversion successful — reload to get full user state
    location.reload();
  } catch { errEl.textContent = '网络错误，请重试'; }
}

// ── API helpers ───────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) { const e = await r.json().catch(()=>({error:r.statusText})); throw new Error(e.error); }
  return r.json();
}

// ── Teams ──────────────────────────────────────────────────────────────────
async function loadTeams() {
  teams = await api('/api/teams');
}

async function loadDMs() {
  dms = await api('/api/teams/dm');
}

async function loadWorkspaces() {
  workspaces = await api('/api/workspaces');
  if (currentWorkspace) {
    currentWorkspace = workspaces.find(item => item.id === currentWorkspace.id) ?? currentWorkspace;
  }
  renderWorkspaces();
}

async function loadWorkspaceChannels(workspaceId) {
  if (!workspaceId) {
    workspaceChannels = [];
    renderWorkspaceChannels();
    return;
  }
  const data = await api(`/api/workspaces/${workspaceId}/channels`);
  workspaceChannels = data.channels ?? [];
  if (currentTeam) {
    currentTeam = workspaceChannels.find(item => item.id === currentTeam.id) ?? currentTeam;
  }
  renderWorkspaceChannels();
}

function renderWorkspaces() {
  const list = document.getElementById('team-list');
  if (!list) return;
  if (workspaces.length === 0) {
    list.innerHTML = `<div class="files-empty" style="padding:8px 16px;color:rgba(245,240,232,0.45)">暂无 workspace</div>`;
    return;
  }
  list.innerHTML = workspaces.map(workspace => `
    <div class="team-item${currentWorkspace?.id===workspace.id?' active':''}" style="padding-right:6px">

function renderWorkspaceChannels() {

async function selectWorkspace(id, { preferredChannelId = null } = {}) {
  const workspace = workspaces.find(item => item.id === id);
  if (!workspace) return;
  currentWorkspace = workspace;
  localStorage.setItem('lastWorkspaceId', id);
  renderWorkspaces();
  await loadWorkspaceChannels(id);

  const target = (preferredChannelId && workspaceChannels.find(channel => channel.id === preferredChannelId))
    || (currentTeam && workspaceChannels.find(channel => channel.id === currentTeam.id))
    || workspaceChannels[0];

  if (target) {
    await selectChannel(target.id);
    return;
  }

  if (currentTeam) socket?.emit('channel:leave', currentTeam.id);
  currentTeam = null;
  currentTeamMembers = { agents: [], humans: [] };
  renderWorkspaceChannels();
  renderCurrentTeamHeader();
  renderTeamAgentsBar();
  const pane = document.getElementById('messages-pane');
  if (pane) pane.innerHTML = `<div class="files-empty" style="padding:24px 20px">这个 workspace 还没有 channel。</div>`;
}

async function selectChannel(id) {
  const channel = workspaceChannels.find(item => item.id === id);
  if (!channel) return;
  if (currentTeam) socket?.emit('channel:leave', currentTeam.id);
  currentTeam = { ...channel, type: 'channel' };
  localStorage.setItem('lastChannelId', id);
  socket?.emit('channel:join', id);
  renderCurrentTeamHeader();
  renderWorkspaces();
  renderWorkspaceChannels();

  const [detail] = await Promise.all([
    api(`/api/channels/${id}`),
    loadMessages(),
  ]);

  const members = detail.members ?? [];
  currentTeamMembers = {
    agents: members
      .filter(member => member.memberType !== 'human')
      .map(member => ({
        id: member.memberId,
        name: member.displayName,
        displayName: member.displayName,
        status: 'active',
        activity: 'idle',
      })),
    humans: members
      .filter(member => member.memberType === 'human')
      .map(member => ({
        id: member.memberId,
        name: member.displayName,
        displayName: member.displayName,
        avatarUrl: member.avatarUrl ?? null,
      })),
  };
  renderTeamAgentsBar();
}

async function selectTeam(id) {

}

function renderDMs() {

// ── Messages ──────────────────────────────────────────────────────────────────
async function loadMessages() {
  if (!currentTeam) return;
  const channelId = currentTeam.id;
  const pane = document.getElementById('messages-pane');
  if (!pane) return;

  const cached = messageCache.get(channelId);
  if (cached) {
    // Render from cache immediately (no network wait) — single DocumentFragment insertion
    renderMessages(cached.msgs, pane);
    // Fetch only new messages since last cached seq
    const { messages: newMsgs } = await api(`/api/channels/${channelId}/messages?limit=30&after=${cached.lastSeq}`);
    if (newMsgs.length > 0) {
      const frag = document.createDocumentFragment();
      newMsgs.forEach(m => frag.appendChild(buildMessageNode(m, false)));
      pane.appendChild(frag);
      pane.scrollTop = pane.scrollHeight;
      cached.msgs.push(...newMsgs);
      cached.lastSeq = newMsgs[newMsgs.length - 1].seq;
    }
  } else {
    const { messages } = await api(`/api/channels/${channelId}/messages?limit=30`);
    renderMessages(messages, pane);
    if (messages.length > 0) {
      messageCache.set(channelId, { msgs: [...messages], lastSeq: messages[messages.length - 1].seq });
    }
  }
}

function buildMessageNode(msg, animate = true) {
  const senderType = msg.senderType ?? 'human';
  const isAgent = senderType !== 'human' && senderType !== 'user';
  const isSystem = msg.messageType === 'system';
  const isTask = msg.messageType === 'task';
  const isActionRequest = msg.messageType === 'action_request';

  const div = document.createElement('div');
  div.dataset.id = msg.id;

  if (isSystem) {
    div.className = 'msg-system-notify' + (animate ? ' msg-enter' : '');
    div.textContent = msg.content;
    return div;
  }

  if (isActionRequest) {
    let actionData = {};
    try { actionData = JSON.parse(msg.content); } catch { /* ignore */ }
    div.className = 'msg-action-card' + (animate ? ' msg-enter' : '');
    div.dataset.actionId = actionData.actionId ?? '';
    div.innerHTML = renderActionCard(msg, actionData);
    return div;
  }

  const initial = (msg.senderName?.[0] ?? '?').toUpperCase();
  const time = new Date(msg.createdAt).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  const senderMeta = {
    human: { label: 'human', avatarClass: 'is-human', nameClass: '', color: 'var(--brown)' },
    user: { label: 'human', avatarClass: 'is-human', nameClass: '', color: 'var(--brown)' },
    channel_agent: { label: 'channel_agent', avatarClass: 'is-agent', nameClass: ' agent', color: 'var(--blue)' },
    agent: { label: 'channel_agent', avatarClass: 'is-agent', nameClass: ' agent', color: 'var(--blue)' },
    sub_agent: { label: 'sub_agent', avatarClass: 'is-agent', nameClass: '', color: 'var(--orange)' },
    worker: { label: 'worker', avatarClass: 'is-agent', nameClass: '', color: 'var(--green)' },
  }[senderType] ?? { label: senderType, avatarClass: 'is-agent', nameClass: '', color: 'var(--blue)' };
  div.className = 'msg' + (animate ? ' msg-enter' : '');
  div.innerHTML = `
    <div class="msg-avatar ${senderMeta.avatarClass}" style="background:${senderMeta.color}">${initial}</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-name${senderMeta.nameClass}" style="color:${senderMeta.color}">${escHtml(msg.senderName)}</span>
        <span class="msg-time">${time}</span>
        <span class="msg-badge">${escHtml(senderMeta.label)}</span>
        ${isTask ? `<span class="msg-badge">task #${msg.taskNumber}</span>` : ''}
      </div>
      <div class="msg-content">${formatContent(msg.content)}</div>
      ${!isTask && msg.id && msg.teamId ? `<div class="msg-actions-hover"><button class="msg-action-btn" onclick="convertToTask('${msg.id}')" title="转为任务">📌</button></div>` : ''}
    </div>`;
  return div;
}

function appendMessage(msg, animate = true) {
  const pane = document.getElementById('messages-pane');
  if (!pane) return;
  const node = buildMessageNode(msg, animate);
  pane.appendChild(node);
  if (msg.messageType === 'action_request') {
    let actionData = {};
    try { actionData = JSON.parse(msg.content); } catch { /* ignore */ }
    hydrateActionCard(actionData.actionId);
  }
}

// Batch-render a list of messages using DocumentFragment (single DOM insertion)
function renderMessages(msgs, pane) {
  const frag = document.createDocumentFragment();
  const actionIds = [];
  for (const m of msgs) {
    frag.appendChild(buildMessageNode(m, false));
    if (m.messageType === 'action_request') {
      let d = {}; try { d = JSON.parse(m.content); } catch { /* ignore */ }
      if (d.actionId) actionIds.push(d.actionId);
    }
  }
  pane.replaceChildren(frag);
  pane.scrollTop = pane.scrollHeight;
  actionIds.forEach(aid => hydrateActionCard(aid));
}

function renderFileCard(f) {
  const url = `/api/teams/${currentTeam.id}/workspace-file?path=${encodeURIComponent(f.path)}`;
  const isImage = f.type === 'image';
  const isViewable = f.type === 'image' || f.type === 'text'; // open in browser
  const thumb = isImage
    ? `<div class="file-card-thumb"><img src="${escAttr(url)}" loading="lazy" onerror="this.parentElement.textContent='🖼️'"></div>`
    : `<div class="file-card-thumb" style="font-size:24px">${fileIcon(f.ext)}</div>`;
  const downloadAttr = isViewable ? '' : `download="${escAttr(f.name)}"`;
  return `<div class="file-card">
    <a class="file-card-link" href="${escAttr(url)}" target="_blank" ${downloadAttr}>
      ${thumb}
      <div class="file-card-info">
        <div class="file-card-name">${escHtml(f.name)}</div>
        <div class="file-card-meta">${escHtml(f.ext || 'file')}</div>
      </div>
    </a>
    <button class="file-card-menu-btn" title="更多" onclick="toggleFileMenu(event, this)">⋯</button>
    <div class="file-card-menu">
      <button class="file-card-menu-item" data-path="${escAttr(f.path)}" data-name="${escAttr(f.name)}" onclick="deleteWorkspaceFile(event, this)">删除</button>
    </div>
  </div>`;
}

function closeFileMenus(exceptMenu = null) {
  document.querySelectorAll('.file-card-menu.open').forEach(menu => {
    if (menu !== exceptMenu) menu.classList.remove('open');
  });
}

function toggleFileMenu(event, btn) {
  event.preventDefault();
  event.stopPropagation();
  const menu = btn.parentElement?.querySelector('.file-card-menu');
  if (!menu) return;
  const shouldOpen = !menu.classList.contains('open');
  closeFileMenus(menu);
  menu.classList.toggle('open', shouldOpen);
}

async function deleteWorkspaceFile(event, btn) {
  event.preventDefault();
  event.stopPropagation();
  const filePath = btn.dataset.path;
  const fileName = btn.dataset.name || filePath;
  if (!currentTeam || !filePath) return;
  if (!confirm(`确定删除 ${fileName} 吗？`)) return;
  btn.disabled = true;
  try {
    await api(`/api/teams/${currentTeam.id}/workspace-file?path=${encodeURIComponent(filePath)}`, { method: 'DELETE' });
    closeFileMenus();
    await loadFiles();
  } catch (e) {
    btn.disabled = false;
    alert(e.message || '删除失败');
  }
}

function fileIcon(ext) {
  const icons = { '.md':'📄', '.txt':'📄', '.pdf':'📑', '.json':'📋', '.csv':'📊',
    '.js':'📜', '.ts':'📜', '.html':'🌐', '.css':'🎨', '.zip':'📦', '.png':'🖼️',
    '.jpg':'🖼️', '.mp4':'🎬', '.mp3':'🎵' };
  return icons[ext] ?? '📎';
}

async function saveBrief() {
  const btn = document.getElementById('brief-save-btn');
  const content = document.getElementById('brief-editor')?.value ?? '';
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    await fetch(`/api/teams/${currentTeam.id}/brief`, {
      method:'PUT', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ content }),
    });
    btn.textContent = '已保存 ✓';
    setTimeout(() => { btn.textContent = '保存'; btn.disabled = false; }, 1500);
  } catch {
    btn.textContent = '失败，重试';
    btn.disabled = false;
  }
}

let currentTaskFilter = 'all';
let _cachedTasks = [];

const TASK_STATUS_LABELS = {
  open: '待办', todo: '待办', in_progress: '进行中', in_review: '审核中', done: '已完成', cancelled: '已取消'
};

function normalizeTaskStatus(s) { return s === 'open' ? 'todo' : s; }

function renderTasks(tasks) {
  _cachedTasks = tasks;
  const pane = document.getElementById('tasks-pane');
  if (!pane) return;
  const open = tasks.filter(t => normalizeTaskStatus(t.taskStatus) !== 'done' && normalizeTaskStatus(t.taskStatus) !== 'cancelled');
  const cnt = document.getElementById('task-count');
  if (cnt) { cnt.textContent = open.length; cnt.style.display = open.length ? '' : 'none'; }

  // compute counts per status
  const counts = { all: tasks.length, todo: 0, in_progress: 0, in_review: 0, done: 0, cancelled: 0 };
  tasks.forEach(t => { const s = normalizeTaskStatus(t.taskStatus); if (counts[s] !== undefined) counts[s]++; });

  const filters = [
    ['all', '全部'], ['todo', '待办'], ['in_progress', '进行中'],
    ['in_review', '审核中'], ['done', '已完成'], ['cancelled', '已取消']
  ];
  const filterBar = `<div class="task-filter-bar">${filters.map(([k, label]) =>
    `<button class="task-filter-pill${currentTaskFilter===k?' active':''}" onclick="setTaskFilter('${k}')">${label}<span class="pill-count">${counts[k]}</span></button>`
  ).join('')}</div>`;

  const filtered = currentTaskFilter === 'all' ? tasks : tasks.filter(t => normalizeTaskStatus(t.taskStatus) === currentTaskFilter);

  if (!filtered.length) {
    pane.innerHTML = filterBar + '<div style="color:var(--text-dim);font-size:12px;margin-top:24px;text-align:center;font-family:\'JetBrains Mono\',monospace">// 暂无任务</div>';
    return;
  }

  pane.innerHTML = filterBar + filtered.map(t => {
    const ns = normalizeTaskStatus(t.taskStatus);
    const assignee = t.taskAssigneeId
      ? (t.taskAssigneeType==='agent' ? '🤖 ' + (t.taskAssigneeName || t.taskAssigneeId.slice(0,8)) : '👤 ' + (t.taskAssigneeName || '我'))
      : '未分配';
    const statusLabel = TASK_STATUS_LABELS[t.taskStatus] || t.taskStatus;
    return `<div class="task-card">
      <span class="task-status status-${ns}">${statusLabel}</span>
      <div class="task-body">
        <div class="task-title">#${t.taskNumber} &nbsp;${escHtml(t.content)}</div>
        <div class="task-meta">${assignee} · ${new Date(t.createdAt).toLocaleDateString('zh-CN')}</div>
        <div class="task-actions">
          ${ns==='todo'?`<button class="task-btn" onclick="claimTask('${t.id}')">认领</button>`:''}
          ${ns==='in_progress'?`<button class="task-btn" onclick="updateTaskStatus('${t.id}','in_review')">提交审核</button>
            <button class="task-btn" onclick="updateTaskStatus('${t.id}','done')">完成</button>
            <button class="task-btn" onclick="unclaimTask('${t.id}')">取消认领</button>`:''}
          ${ns==='in_review'?`<button class="task-btn" onclick="updateTaskStatus('${t.id}','done')">通过</button>
            <button class="task-btn" onclick="updateTaskStatus('${t.id}','in_progress')">打回</button>`:''}
          ${ns!=='done'&&ns!=='cancelled'?`<button class="task-btn" onclick="updateTaskStatus('${t.id}','cancelled')">取消</button>`:''}
          <button class="task-btn task-btn-danger" onclick="deleteTask('${t.id}')">删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setTaskFilter(filter) {
  currentTaskFilter = filter;
  renderTasks(_cachedTasks);
}

// ── Action approval card ──────────────────────────────────────────────────────

function actionStatusLabel(status) {

function renderActionCard(msg, actionData) {
  const { actionId, actionType, platform, description, payload } = actionData;
  const senderName = escHtml(msg.senderName ?? '');
  const time = new Date(msg.createdAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  const platformLabel = { x: 'X (Twitter)', xhs: '小红书', youtube: 'YouTube', email: '邮件', feishu: '飞书' }[platform] ?? platform ?? '';
  const payloadView = renderActionPayload(payload);

  return `
    <div class="action-card-header">
      <span class="action-card-icon">⚡</span>
      <span class="action-card-title">操作审批请求</span>
      <span class="action-card-badge" id="action-badge-${actionId}">待审批</span>
    </div>
    <div class="action-card-meta">来自 @${senderName} · ${time}${platformLabel ? ' · 平台：' + platformLabel : ''}</div>
    <div class="action-card-desc">${escHtml(description ?? actionType)}</div>
    ${payloadView}
    <div class="action-card-btns" id="action-btns-${actionId}">
      <button class="action-approve-btn" onclick="approveAction('${actionId}', this)">批准</button>
      <button class="action-reject-btn" onclick="rejectAction('${actionId}', this)">拒绝</button>
    </div>`;
}

function renderActionPayload(payload) {
  if (!payload || typeof payload !== 'object') return '';
  const fields = [
    ['title', '标题'],
    ['text', '正文'],
    ['content', '内容'],
    ['tags', '标签'],
    ['images', '图片'],
    ['imageUrls', '图片'],
    ['url', '链接'],
  ];
  const used = new Set();
  const parts = [];

  for (const [key, label] of fields) {
    if (payload[key] == null || payload[key] === '') continue;
    used.add(key);
    parts.push(renderActionPayloadField(label, payload[key]));
  }

  const extra = {};
  for (const [key, value] of Object.entries(payload)) {
    if (!used.has(key) && value != null && value !== '') extra[key] = value;
  }
  if (Object.keys(extra).length) {
    parts.push(`
      <div class="action-payload-field">
        <div class="action-payload-label">其他字段</div>
        <pre class="action-payload-json">${escHtml(JSON.stringify(extra, null, 2))}</pre>
      </div>`);
  }

  if (!parts.length) return '';
  return `
    <details class="action-card-payload">
      <summary>完整内容</summary>
      <div class="action-card-payload-body">${parts.join('')}</div>
    </details>`;
}

function renderActionPayloadField(label, value) {
  const text = Array.isArray(value)
    ? value.map(v => typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v)).join('\n')
    : typeof value === 'object'
      ? JSON.stringify(value, null, 2)
      : String(value);
  return `
    <div class="action-payload-field">
      <div class="action-payload-label">${escHtml(label)}</div>
      <div class="action-payload-value">${escHtml(text)}</div>
    </div>`;
}

async function hydrateActionCard(actionId) {
  if (!actionId) return;
  try {
    const action = await api(`/api/actions/${actionId}`);

  }
}

function applyActionStatus(action) {
  if (!action?.id) return;
  const card = document.querySelector(`.msg-action-card[data-action-id="${action.id}"]`);
  if (!card) return;

  card.className = `msg-action-card status-${action.status}`;
  const badge = card.querySelector('.action-card-badge');
  if (badge) {
    badge.className = `action-card-badge ${action.status}`;
    badge.textContent = actionStatusLabel(action.status);
  }

  const btns = card.querySelector('.action-card-btns');
  if (!btns) return;
  if (action.status === 'pending') {
    btns.innerHTML = `
      <button class="action-approve-btn" onclick="approveAction('${action.id}', this)">批准</button>
      <button class="action-reject-btn" onclick="rejectAction('${action.id}', this)">拒绝</button>`;
  } else if (action.status === 'approved') {
    btns.innerHTML = '<span class="action-executing-hint">⏳ 已通知 Agent，等待执行…</span>';
  } else {
    btns.innerHTML = '';
  }
}

// ── Socket.IO ─────────────────────────────────────────────────────────────────
function setupSocket() {
  socket = io({ auth: { serverId: 'server-001' }, withCredentials: true });

  socket.on('connect', () => {
    const b = document.getElementById('conn-badge');
    b.className = 'connected'; b.textContent = '◉ 已连接';
    if (currentTeam) socket.emit('channel:join', currentTeam.id);
  });

  socket.on('disconnect', () => {
    const b = document.getElementById('conn-badge');
    b.className = 'disconnected'; b.textContent = '◉ 未连接';
    // Clear cache so reconnect fetches fresh messages (may have missed some while offline)
    messageCache.clear();
  });

  socket.on('message:new', msg => {
    // Keep cache up to date regardless of which team is currently visible
    const roomId = msg.channelId ?? msg.teamId;
    const cached = messageCache.get(roomId);
    if (cached && msg.seq != null) {
      cached.msgs.push(msg);
      cached.lastSeq = msg.seq;
    }
    if (roomId === currentTeam?.id && currentTab === 'messages') {
      appendMessage(msg, true);
      const pane = document.getElementById('messages-pane');
      if (pane) pane.scrollTop = pane.scrollHeight;
    }
  });

  socket.on('task:created', () => { if (currentTab==='tasks') loadTasks(); updateTaskBadge(); });
  socket.on('task:updated', () => { if (currentTab==='tasks') loadTasks(); updateTaskBadge(); });
  socket.on('task:deleted', () => { if (currentTab==='tasks') loadTasks(); updateTaskBadge(); });

  socket.on('action:updated', ({ action }) => {
    applyActionStatus(action);
  });

  socket.on('agent:activity', ({ agentId, activity, detail }) => {
    const agent = agents.find(a => a.id === agentId);
    if (agent) { agent.activity = activity; agent.activityDetail = detail; renderAgents(); renderTeamAgentsBar(); }
  });

  socket.on('agent:created', () => loadAgents());
  socket.on('agent:deleted', () => loadAgents());

  socket.on('machine:status', ({ machineId, status }) => {
    const m = machines.find(x => x.id === machineId);
    if (m) { m.status = status; renderMachines(); }
  });

  socket.on('machine:capabilities', ({ machineId, runtimes, hostname, os, daemonVersion }) => {
    const m = machines.find(x => x.id === machineId);
    if (m) { Object.assign(m, { runtimes, hostname, os, daemonVersion }); renderMachines(); }
  });

  socket.on('team:updated', () => loadTeams());
  socket.on('dm:new', () => loadDMs());
  socket.on('workspace:updated', async () => {
    await loadWorkspaces();
    if (currentWorkspace && !workspaces.find(w => w.id === currentWorkspace.id)) {
      await selectInitialTeam();
    } else {
      renderWorkspaces();
    }
  });
  socket.on('channel:updated', async ({ workspaceId } = {}) => {
    if (!currentWorkspace) return;
    if (workspaceId && workspaceId !== currentWorkspace.id) return;
    await loadWorkspaceChannels(currentWorkspace.id);
    if (currentTeam && !workspaceChannels.find(ch => ch.id === currentTeam.id)) {
      const first = workspaceChannels[0] ?? null;
      if (first) await selectChannel(first.id);
      else {
        currentTeam = null;
        currentTeamMembers = { agents: [], humans: [] };
        renderCurrentTeamHeader();
        renderTeamAgentsBar();
        const pane = document.getElementById('messages-pane');
        if (pane) pane.innerHTML = `<div class="files-empty" style="padding:24px 20px">这个 workspace 还没有 channel。</div>`;
      }
    } else {
      renderWorkspaceChannels();
    }
  });
  socket.on('ping', () => socket.emit('pong'));

  // Browser login events from daemon (via server broadcast)
  socket.on('browser:screenshot', ({ screenshot }) => {
    const img = document.getElementById('browser-login-screenshot');
    const placeholder = document.getElementById('browser-login-placeholder');
    if (img) {
      img.src = 'data:image/jpeg;base64,' + screenshot;
      img.style.display = 'block';
    }
    if (placeholder) placeholder.style.display = 'none';
  });

  socket.on('browser:login_status', ({ platform, message }) => {
    if (_browserLoginActivePlatform && platform && platform !== _browserLoginActivePlatform) return;
    const statusEl = document.getElementById('browser-login-status');
    const placeholder = document.getElementById('browser-login-placeholder');
    if (statusEl && message) statusEl.textContent = message;
    if (placeholder && message) placeholder.textContent = message;
  });

  socket.on('browser:login_complete', async () => {
    const statusEl = document.getElementById('browser-login-status');
    if (statusEl) statusEl.textContent = '✓ 登录成功！';
    await refreshPlatformList();
    setTimeout(() => _browserLoginCloseModal(), 1500);
  });

  socket.on('browser:login_error', ({ error }) => {
    const statusEl = document.getElementById('browser-login-status');
    if (statusEl) statusEl.textContent = '启动失败：' + (error || '未知错误');
    const placeholder = document.getElementById('browser-login-placeholder');
    if (placeholder) placeholder.textContent = '启动失败';
  });
}

async function manageChannel(channelId) {
