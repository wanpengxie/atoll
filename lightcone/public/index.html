    const members = detail.members?.map(member => `${member.displayName} (${member.memberType})`).join('\n') || '暂无成员';
    const action = prompt(

    );

      await api(`/api/channels/${channelId}`, { method: 'PATCH', body });
    } else if (action.startsWith('new:')) {
      const name = action.slice(4).trim();
      if (!name) return;
      await api(`/api/channels/${channelId}`, { method: 'PATCH', body: { name } });

        method: 'POST',

function isInputComposing(e) {
  return isMessageComposing || e.isComposing || e.keyCode === 229;
}

function handleKey(e) {
  if (isInputComposing(e)) return;
  const popup = document.getElementById('mention-popup');
  if (popup && popup.style.display !== 'none') {
    const items = popup.querySelectorAll('.mention-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); mentionIdx = Math.min(mentionIdx+1, items.length-1); highlightMention(items); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); mentionIdx = Math.max(mentionIdx-1, 0); highlightMention(items); return; }
    if ((e.key === 'Enter' || e.key === 'Tab') && mentionIdx >= 0 && items[mentionIdx]) {
      e.preventDefault(); insertMention(items[mentionIdx].dataset.name); return;
    }
    if (e.key === 'Escape') { popup.style.display = 'none'; return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function highlightMention(items) {
  items.forEach((el, i) => el.classList.toggle('active', i === mentionIdx));
}

// Build the mentionable list: current team agents + humans
function getMentionables() {
  const list = [];
  for (const a of (currentTeamMembers.agents ?? [])) {
    list.push({ name: a.name, displayName: a.displayName || a.name, type: 'agent' });
  }
  for (const u of (currentTeamMembers.humans ?? [])) {
    list.push({ name: u.name, displayName: u.displayName || u.name, type: 'human' });
  }
  const seen = new Set();
  return list.filter(m => { if (seen.has(m.name)) return false; seen.add(m.name); return true; });
}

function checkMention(el) {
  const popup = document.getElementById('mention-popup');
  if (!popup) return;
  const val = el.value.slice(0, el.selectionStart);
  const match = val.match(/@([\w-]*)$/);
  if (!match) { popup.style.display = 'none'; return; }
  const query = match[1].toLowerCase();
  const all = getMentionables();
  const filtered = all.filter(m =>
    m.name.toLowerCase().includes(query) || m.displayName.toLowerCase().includes(query)
  );
  if (!filtered.length) { popup.style.display = 'none'; return; }
  mentionIdx = 0;
  popup.innerHTML = filtered.map((m, i) => {
    const initial = (m.displayName[0] ?? '?').toUpperCase();
    const avatarClass = m.type === 'agent' ? 'is-agent' : 'is-human';
    return `<div class="mention-item${i===0?' active':''}" data-name="${escAttr(m.name)}" onmousedown="insertMention('${escAttr(m.name)}')">
      <div class="mi-avatar ${avatarClass}">${initial}</div>
      <div class="mi-info"><span class="mi-name">${escHtml(m.displayName)}</span><span class="mi-handle">@${escHtml(m.name)}</span></div>
    </div>`;
  }).join('');
  popup.style.display = 'block';
}

function insertMention(name) {
  const inp = document.getElementById('msg-input');
  const pos = inp.selectionStart;
  const before = inp.value.slice(0, pos);
  const after = inp.value.slice(pos);
  const atIdx = before.lastIndexOf('@');
  inp.value = before.slice(0, atIdx) + '@' + name + ' ' + after;
  const newPos = atIdx + name.length + 2;
  inp.setSelectionRange(newPos, newPos);
  inp.focus();
  document.getElementById('mention-popup').style.display = 'none';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function switchTab(tab) {
  if ((tab === 'tasks' || tab === 'files') && currentUser?.isGuest) { showGuestRegister(); return; }
  currentTab = tab;
  const tabIdx = { messages: 0, tasks: 1, files: 2 };
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i === (tabIdx[tab] ?? 0)));
  const mp = document.getElementById('messages-pane');
  const tp = document.getElementById('tasks-pane');
  const fp = document.getElementById('files-pane');
  const ti = document.getElementById('task-input-row');
  const ia = document.getElementById('input-area');
  if (mp) mp.style.display = tab==='messages' ? 'flex' : 'none';
  if (tp) tp.style.display = tab==='tasks'    ? 'flex' : 'none';
  if (fp) fp.style.display = tab==='files'    ? 'flex' : 'none';
  if (ti) ti.style.display = tab==='tasks'    ? 'flex' : 'none';
  if (ia) ia.style.display = tab==='files'    ? 'none' : 'block';
  if (tab==='tasks') loadTasks();
  if (tab==='files') loadFiles();
}

  ).join('');

  overlay.innerHTML = `
    <div class="key-modal" style="max-width:420px">
      <h3 style="margin-bottom:12px">团队设置</h3>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
        <div>
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">团队名称</div>
          <input id="mg-team-name" value="${escAttr(ch.name)}" placeholder="团队名称" style="width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:'Outfit',sans-serif;outline:none">
        </div>
        <div>
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">描述（可选）</div>

        </div>
      </div>

        <button class="btn-close-modal" onclick="this.closest('.key-modal-overlay').remove()">取消</button>

        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px">飞书群绑定${currentUser?.isGuest ? '<span style="font-size:11px;color:var(--text-dim);font-weight:400;margin-left:8px">注册后可配置</span>' : ''}</div>

        <div id="mg-feishu-status" style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px">

        ...toRemove.map(id => api(`/api/teams/${teamId}/members/agent/${id}`,  { method: 'DELETE' })),

      overlay.querySelectorAll('.agent-member-row').forEach(row => {

        const ta = row.querySelector('[data-role-prompt]');
        const newRp = ta?.value ?? '';
        const origRp = memberMap.get(agId)?.rolePrompt ?? '';
        if (newRp !== origRp || toAdd.includes(agId)) {
          roleUpdates.push(api(`/api/teams/${teamId}/members/agent/${agId}`, { method: 'PATCH', body: { rolePrompt: newRp } }));

    } catch(e) { alert(e.message); }
  });

  // Feishu binding code generation
  const codeBtn = overlay.querySelector('#mg-feishu-code-btn');
  if (codeBtn) {
    // Show existing code if still valid

        showBindingCode(overlay, data.code, new Date(data.expiresAt));
      } catch(e) { alert(e.message); }

  const deleteBtn = overlay.querySelector('#mg-delete-team');

          if (first) selectTeam(first.id);
          else showEmptyState();
        }
      } catch(e) { alert(e.message); }
    });
  }
}

let _bindingCountdownTimer = null;
function showBindingCode(overlay, code, expiresAt) {
  const area = overlay.querySelector('#mg-feishu-code-area');
  const codeEl = overlay.querySelector('#mg-feishu-code');
  const countdown = overlay.querySelector('#mg-feishu-countdown');
  if (!area || !codeEl || !countdown) return;
  codeEl.textContent = code;
  area.style.display = 'block';
  if (_bindingCountdownTimer) clearInterval(_bindingCountdownTimer);
  function tick() {
    const secs = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
    if (secs <= 0) { countdown.textContent = '已过期'; clearInterval(_bindingCountdownTimer); return; }
    const m = Math.floor(secs/60), s = secs%60;
    countdown.textContent = `${m}:${String(s).padStart(2,'0')} 后过期`;
  }
  tick();
  _bindingCountdownTimer = setInterval(tick, 1000);
}

// Fetch all skills + agent bindings in parallel, then populate the skills section in the modal
async function _loadAgentSkillsSection(agentId, overlay) {
  const bindingsDiv = overlay.querySelector('#ea-skill-bindings');
  const skillSelect = overlay.querySelector('#ea-skill-select');
  if (!bindingsDiv || !skillSelect) return;
  try {
    const [allSkills, boundRes] = await Promise.all([
      api('/api/skills'),
      api(`/api/agents/${agentId}/skills`),
    ]);
    const boundSkills = [...(boundRes.platform ?? []), ...(boundRes.user ?? [])];
    const agentBindings = boundSkills.map(s => ({ skillId: s.id, skillName: s.name }));

    bindingsDiv.innerHTML = agentBindings.length
      ? agentBindings.map(b => `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px">
            <span style="flex:1;font-family:'IBM Plex Mono',monospace">${escHtml(b.skillName)}</span>
            <button onclick="unbindSkillFromAgent('${escAttr(b.skillId)}','agent','${escAttr(agentId)}',this)" style="font-size:11px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text-muted);cursor:pointer">解绑</button>
          </div>`).join('')
      : '<div style="font-size:11px;color:var(--text-dim)">未绑定任何 Skill</div>';

    skillSelect.innerHTML = allSkills
      .filter(s => !agentBindings.some(b => b.skillId === s.id))
      .map(s => `<option value="${escAttr(s.id)}">${escHtml(s.name)}${s.type === 'platform' ? ' (platform)' : ''}</option>`)
      .join('');
  } catch {
    if (bindingsDiv) bindingsDiv.innerHTML = '<div style="font-size:11px;color:var(--text-dim)">加载失败</div>';
  }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  if (cb) cb();
}
function copyWithToast(text) {
  const done = () => showToast('已复制到剪贴板');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function showToast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  Object.assign(el.style, {
    position:'fixed', bottom:'32px', left:'50%', transform:'translateX(-50%)',
    background:'var(--accent)', color:'#fff', padding:'8px 20px', borderRadius:'8px',
    fontSize:'13px', fontWeight:'600', zIndex:'99999', opacity:'0',
    transition:'opacity .2s', pointerEvents:'none',
  });
  document.body.appendChild(el);
  requestAnimationFrame(() => el.style.opacity = '1');
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 2000);
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatContent(text) {
  const escaped = escHtml(text);
  const myName = currentUser?.name;
  return escaped
    .replace(/@([\w-]+)/g, (match, name) => {
      const isMe = myName && name.toLowerCase() === myName.toLowerCase();
      return `<span class="mention${isMe ? ' mention-me' : ''}">${match}</span>`;
    })
    .replace(/https?:\/\/[^\s<>"'）)，。\]]+/g, url =>
      `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:underline;word-break:break-all">${url}</a>`
    );
}
function escAttr(s) {
  return escHtml(s).replace(/'/g,'&#39;');
}

function showXAppSetup() {

  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function submitXAppSetup() {
  const fields = {};
  for (const input of document.querySelectorAll('[id^="xapp-"]')) {
    const key = input.id.replace('xapp-', '');
    if (input.value.trim()) fields[key] = input.value.trim();
  }
  if (!fields.X_CONSUMER_KEY || !fields.X_CONSUMER_SECRET) return alert('请填写 API Key 和 API Secret');
  try {
    await api('/api/oauth/x/app-setup', { method: 'POST', body: fields });
    // Now start OAuth flow
    window.location.href = '/api/oauth/x/start';
  } catch(e) { alert(e.message || '保存失败'); }
}

function showXReadonlySetup() {
  const el = document.getElementById('x-readonly-setup');

}

async function submitXReadonlyToken() {
  const token = document.getElementById('x-readonly-token-input')?.value?.trim();

async function _browserLoginStart(platform) {
  const machineId = document.getElementById('browser-login-machine-select')?.value;
  if (!machineId) return;

  const btn = document.getElementById('browser-login-start-btn');
  const selectRow = document.getElementById('browser-login-machine-select-row');
  const placeholder = document.getElementById('browser-login-placeholder');
  if (btn) btn.disabled = true;
  if (placeholder) placeholder.textContent = '正在启动浏览器...';

  _browserLoginActiveMachineId = machineId;
  _browserLoginActivePlatform = platform;

  try {
    await api(`/api/oauth/${platform}/browser-login/start`, { method: 'POST', body: { machineId } });
    if (selectRow) selectRow.style.display = 'none';
    const statusEl = document.getElementById('browser-login-status');
    if (statusEl) statusEl.textContent = '启动请求已发送，等待浏览器截图...';
    if (placeholder) placeholder.textContent = '等待浏览器截图...';
  } catch(e) {
    const statusEl = document.getElementById('browser-login-status');
    if (statusEl) statusEl.textContent = '启动失败：' + (e.message || '未知错误');
    if (btn) btn.disabled = false;
    _browserLoginActiveMachineId = null;
    _browserLoginActivePlatform = null;
  }
}

async function disconnectPlatform(credentialId, btn) {

async function refreshGrants(credId) {
  const el = document.getElementById('grants-list');
  if (!el) return;
  try {
    const grants = await api(`/api/credentials/${credId}/grants`);
    if (!grants.length) { el.innerHTML = `<div style="color:var(--text-dim);font-size:12px">暂无授权，Agent 尚不能使用此账号</div>`; return; }
    el.innerHTML = grants.map(g => {
      const agent = agents.find(a => a.id === g.granteeId);
      const label = agent ? (agent.displayName || agent.name) : g.granteeId.slice(0, 8) + '…';
      return `<div class="identity-item">
        <span style="flex:1;font-size:13px">@${escHtml(label)}</span>
        <button class="unlink-btn" onclick="revokeGrant('${credId}','${g.granteeType}','${g.granteeId}',this)">移除</button>
      </div>`;
    }).join('');
  } catch(e) { el.innerHTML = `<div style="color:var(--danger);font-size:12px">${escHtml(e.message)}</div>`; }
}

async function addGrant(credId, granteeType, granteeId) {
  if (!granteeId) return alert('请选择 Agent');
  try {
    await api(`/api/credentials/${credId}/grants`, { method: 'POST', body: { granteeType, granteeId } });
    await refreshGrants(credId);
  } catch(e) { alert(e.message || '授权失败'); }
}

async function revokeGrant(credId, granteeType, granteeId, btn) {
  btn.disabled = true;
  try {
    await api(`/api/credentials/${credId}/grants`, { method: 'DELETE', body: { granteeType, granteeId } });
    await refreshGrants(credId);
  } catch(e) { btn.disabled = false; alert(e.message || '撤销失败'); }
}

// OAuth 回调处理：页面加载时检查 ?oauth=success/denied/error
function checkOAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('oauth');
  if (!status) return;
  // 清除 URL 参数
  window.history.replaceState({}, '', window.location.pathname);
  if (status === 'success') {
    const platform = params.get('platform') ?? '平台';
    setTimeout(() => openCredentialsPanel(), 300);
  } else if (status === 'denied') {
    alert('你取消了账号授权。');
  } else if (status === 'error') {
    const reason = params.get('reason') ?? 'unknown';
    alert(`账号连接失败（${reason}），请重试。`);
  }
}

              <div style="font-size:13px;font-weight:700;color:${p.color};margin-bottom:4px">${p.name}</div>
              <div style="font-size:20px;font-weight:800;margin-bottom:10px">${p.priceLabel}</div>
              <div style="font-size:11px;color:var(--text-muted);line-height:1.8">${p.features.map(f=>`• ${f}`).join('<br>')}</div>
            </div>
          `).join('')}
        </div>

        ${sel.price > 0 ? `
        <div style="border-top:1px solid var(--border);padding-top:20px;margin-bottom:20px">
          <div style="font-size:13px;font-weight:600;margin-bottom:14px">支付信息 <span style="font-size:11px;font-weight:400;color:var(--text-muted)">(演示环境 — 无真实扣款)</span></div>
          <div style="display:grid;gap:10px">
            <input placeholder="卡号  4242 4242 4242 4242" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'Outfit',sans-serif;outline:none" readonly value="4242 4242 4242 4242">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <input placeholder="有效期  12/28" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'Outfit',sans-serif;outline:none" readonly value="12 / 28">
              <input placeholder="CVV  123" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'Outfit',sans-serif;outline:none" readonly value="123">
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:13px;color:var(--text-muted);white-space:nowrap">确认金额 $</span>
              <input id="upgrade-amount-input" type="number" placeholder="${sel.price}" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'Outfit',sans-serif;outline:none;width:120px">
              <span style="font-size:12px;color:var(--text-muted)">请输入 ${sel.price} 完成验证</span>
            </div>
          </div>
        </div>` : ''}

        <div id="upgrade-error" style="color:var(--danger,#e55);font-size:12px;margin-bottom:10px;min-height:16px"></div>

        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button onclick="document.getElementById('upgrade-modal-root').remove()" style="background:none;border:1px solid var(--border-2);color:var(--text-muted);padding:8px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif">取消</button>
          <button id="upgrade-confirm-btn" onclick="window._upgradeConfirm()" style="background:${sel.color};border:none;color:#fff;padding:8px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif">
            ${sel.price === 0 ? '切换到 Hobby' : `支付 $${sel.price} 并升级`}
          </button>
        </div>
      </div>`;
  }

  window._upgradePlanSelect = (id) => { selectedPlan = id; render(); };

  window._upgradeConfirm = async () => {
    const sel = plans.find(p => p.id === selectedPlan);
    const errEl = document.getElementById('upgrade-error');
    const btn = document.getElementById('upgrade-confirm-btn');
    let amount = sel.price;
    if (sel.price > 0) {
      amount = parseFloat(document.getElementById('upgrade-amount-input')?.value);
    }
    btn.disabled = true;
    btn.textContent = '处理中...';
    try {
      await api('/api/servers/server-001/upgrade', {
        method: 'POST',
        body: { plan: sel.id, amount }
      });
      document.getElementById('upgrade-modal-root').remove();
      await loadPlanInfo();
      // Show success toast
      const t = document.createElement('div');
      t.textContent = `✓ 已升级到 ${sel.name} 套餐！`;
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.3)';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    } catch (e) {
      errEl.textContent = e.message || '升级失败，请重试';
      btn.disabled = false;
      btn.textContent = sel.price === 0 ? '切换到 Hobby' : `支付 $${sel.price} 并升级`;
    }
  };

  render();
  document.body.appendChild(overlay);
}

function showLinkPasswordForm(btn) {
  const container = btn.closest('.settings-panel').querySelector('#link-pw-container');
  container.innerHTML = `
    <div class="link-pw-form">
      <input id="link-pw-user" placeholder="用户名" autocomplete="username">
      <input id="link-pw-pass" placeholder="密码" type="password" autocomplete="new-password">
      <div class="form-row">
        <button onclick="submitLinkPassword()">确认关联</button>
      </div>
    </div>`;
}

async function submitLinkPassword() {
  const username = document.getElementById('link-pw-user')?.value.trim();
  const password = document.getElementById('link-pw-pass')?.value;
  if (!username || !password) return;
  try {
    const res = await api('/api/auth/link/password', { method: 'POST', body: { username, password } });
    if (res.merged) showToast('账号已合并，所有资源已转移');
    else if (res.already) showToast('已经关联过了');
    else showToast('密码账号关联成功');
    document.querySelector('.settings-panel')?.parentElement.remove();
    openSettings();
  } catch (e) { alert(e.message); }
}

async function unlinkIdentity(identityId, btn) {
  if (!confirm('确定要解除此登录方式？')) return;
  try {
    await api(`/api/auth/identities/${identityId}`, { method: 'DELETE' });
    showToast('已解除关联');
    btn.closest('.settings-panel')?.parentElement.remove();
    openSettings();
  } catch (e) { alert(e.message); }
}

// ── Machine Key Modal ─────────────────────────────────────────────────────────
function showMachineKeyModal(machineName, apiKey) {
  const serverUrl = window.location.origin;
  const startCmd  = `npx --yes @lightcone-ai/daemon@latest --server-url ${serverUrl} --api-key ${apiKey}`;
  const overlay = document.createElement('div');
  overlay.className = 'key-modal-overlay';
  overlay.innerHTML = `
    <div class="key-modal">
      <h3>机器「${escHtml(machineName)}」</h3>
      <p style="margin-bottom:6px">在目标机器上运行以下命令启动 Daemon（API Key 只显示一次，请妥善保存）：</p>
      <div class="key-modal-cmd" id="mkm-start">${escHtml(startCmd)}</div>
      <div class="key-modal-copy" style="margin-bottom:18px">
        <button class="btn-close-modal" onclick="this.closest('.key-modal-overlay').remove()">关闭</button>
        <button class="btn-copy-cmd" id="mkm-copy-start">复制命令</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function setupCopy(btnId, text) {
    const btn = overlay.querySelector(btnId);
    if (!btn) return;
    btn.addEventListener('click', () => {
      const done = () => { btn.textContent = '已复制！'; setTimeout(() => btn.textContent = btnId === '#mkm-copy-start' ? '复制命令' : '复制', 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      else fallbackCopy(text, done);
    });
  }
  setupCopy('#mkm-copy-start', startCmd);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

  const renderSkillRow = (s) => {
    const badge = s.mcpConfig
      ? `<span style="font-size:10px;color:var(--accent);padding:2px 6px;border:1px solid var(--accent);border-radius:4px">MCP: ${escHtml(s.mcpConfig.server)}</span>`
      : `<span style="font-size:10px;color:var(--text-dim);padding:2px 6px;border:1px solid var(--border);border-radius:4px">${s.type}</span>`;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface-2);border-radius:6px;cursor:pointer"

async function editSkill(id) {
  const skill = await api(`/api/skills/${id}`, { credentials: 'include' });
  const bindings = await api(`/api/skills/${id}/bindings`, { credentials: 'include' });
  const readonly = skill.type === 'platform';
  const inp = `style="display:block;width:100%;margin-top:4px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;box-sizing:border-box"`;
  const lbl = `style="font-size:12px;color:var(--text-muted)"`;
  const dis = readonly ? 'disabled' : '';

  const teamBindings = bindings.filter(b => b.target_type === 'team');
  const agentBindings = bindings.filter(b => b.target_type === 'agent');
  const teamOpts = teams.map(c => `<option value="${escAttr(c.id)}">#${escHtml(c.name)}</option>`).join('');
  const agentOpts = agents.map(a => `<option value="${escAttr(a.id)}">${escHtml(a.displayName)}</option>`).join('');

  const bindingRow = (b) => {
    const label = b.target_type === 'team'
      ? '#' + (teams.find(c => c.id === b.target_id)?.name ?? b.target_id)
      : (agents.find(a => a.id === b.target_id)?.displayName ?? b.target_id);
    return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
      <span style="font-size:12px;color:var(--text)">${b.target_type === 'team' ? '团队' : 'Agent'}: ${escHtml(label)}</span>
      ${readonly ? '' : `<button style="font-size:11px;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer"
        onclick="removeSkillBinding('${escAttr(id)}','${escAttr(b.target_type)}','${escAttr(b.target_id)}',this)">解绑</button>`}
    </div>`;
  };

  const overlay = document.createElement('div');
  overlay.className = 'key-modal-overlay';
  overlay.innerHTML = `
    <div class="key-modal" style="max-width:520px;max-height:85vh;overflow-y:auto">
      <h3 style="margin-bottom:18px">${readonly ? '查看' : '编辑'} Skill — ${escHtml(skill.name)}</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        <label ${lbl}>名称
          <input id="es-name" value="${escAttr(skill.name)}" ${inp} ${dis}>
        </label>
        <label ${lbl}>描述
          <input id="es-desc" value="${escAttr(skill.description)}" ${inp} ${dis}>
        </label>
        <label ${lbl}>内容
          <textarea id="es-content" rows="12" style="display:block;width:100%;margin-top:4px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;box-sizing:border-box;resize:vertical" ${dis}>${escHtml(skill.content)}</textarea>
        </label>
        <label ${lbl}>标签
          <input id="es-tags" value="${escAttr((skill.tags||[]).join(', '))}" ${inp} ${dis}>
        </label>
        ${skill.mcpConfig ? `
        <div style="background:rgba(200,80,80,0.08);border:1px solid var(--accent);border-radius:6px;padding:8px 12px">
          <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px">能力型 Skill — 提供 MCP 工具</div>
          <div style="font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace">
            Server: ${escHtml(skill.mcpConfig.server)} · Command: ${escHtml(skill.mcpConfig.command)}
            ${skill.mcpConfig.env?.length ? `<br>需要环境变量: ${skill.mcpConfig.env.join(', ')}` : ''}
          </div>
        </div>` : ''}

        <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
          <div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px">绑定</div>
          <div id="es-bindings">${bindings.length > 0 ? bindings.map(bindingRow).join('') : '<div style="font-size:12px;color:var(--text-dim)">未绑定到任何团队或 Agent</div>'}</div>
          ${readonly ? '' : `
          <div style="display:flex;gap:8px;margin-top:10px">
            <select id="es-bind-type" style="padding:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px">

              <option value="agent">Agent</option>

          </div>
          <script>

              document.getElementById('es-bind-target').innerHTML = this.value === 'team' ? \`${teamOpts}\` : \`${agentOpts}\`;
            });
          </scr` + `ipt>`}
        </div>
      </div>
      <div class="key-modal-copy" style="margin-top:20px">
        ${readonly ? '' : `<button style="color:#e74c3c;background:none;border:1px solid #e74c3c;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px" onclick="deleteSkill('${escAttr(id)}')">删除</button>`}
        <div style="flex:1"></div>
        <button class="btn-close-modal" onclick="this.closest('.key-modal-overlay').remove()">${readonly ? '关闭' : '取消'}</button>
        ${readonly ? '' : '<button class="btn-copy-cmd" id="es-submit">保存</button>'}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  if (!readonly) {
    overlay.querySelector('#es-submit').addEventListener('click', async () => {
      const tagsRaw = overlay.querySelector('#es-tags').value.trim();
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
      try {
        await api(`/api/skills/${id}`, { method: 'PATCH', body: {
          name: overlay.querySelector('#es-name').value.trim(),
          description: overlay.querySelector('#es-desc').value.trim(),
          content: overlay.querySelector('#es-content').value,
          tags,
        }});
        overlay.remove();
      } catch(e) { alert(e.message); }
    });
  }
}

async function addSkillBinding(skillId) {
  const targetType = document.getElementById('es-bind-type').value;
  const targetId = document.getElementById('es-bind-target').value;
  if (!targetId) return;
  try {
    await api(`/api/skills/${skillId}/bindings`, { method: 'POST', body: { targetType, targetId } });
    document.querySelector('.key-modal-overlay')?.remove();
    editSkill(skillId);
  } catch(e) { alert(e.message); }
}

async function removeSkillBinding(skillId, targetType, targetId, btn) {
  try {
    await api(`/api/skills/${skillId}/bindings`, { method: 'DELETE', body: { targetType, targetId } });
    btn.closest('div').remove();
  } catch(e) { alert(e.message); }
}

async function bindSkillToAgent(agentId, btn) {
  const select = btn.parentElement.querySelector('#ea-skill-select');
  const skillId = select?.value;
  if (!skillId) return;
  try {
    // Fetch skill to check for mcp env requirements
    const skill = await api(`/api/skills/${skillId}`);
    await api(`/api/skills/${skillId}/bindings`, { method: 'POST', body: { targetType: 'agent', targetId: agentId } });

    // Inject missing env var keys into the envVars textarea
    if (skill.mcpConfig?.env?.length) {
      const envArea = btn.closest('.key-modal').querySelector('#ea-envvars');
      if (envArea) {
        const existing = envArea.value;
        const existingKeys = existing.split('\n').map(l => l.split('=')[0].trim()).filter(Boolean);
        const missing = skill.mcpConfig.env.filter(k => !existingKeys.includes(k));
        if (missing.length) {
          const template = missing.map(k => `${k}=`).join('\n');
          envArea.value = existing ? `${existing.trimEnd()}\n${template}` : template;
          envArea.focus();
          showToast(`已注入 ${missing.length} 个环境变量，请填写对应的值`);
          return; // don't refresh modal, let user fill in values
        }
      }
    }

    // Refresh the agent edit modal
    btn.closest('.key-modal-overlay').remove();
    editAgent(agentId);
  } catch(e) { alert(e.message); }
}

async function unbindSkillFromAgent(skillId, targetType, agentId, btn) {
  try {
    await api(`/api/skills/${skillId}/bindings`, { method: 'DELETE', body: { targetType, targetId: agentId } });
    // Refresh the agent edit modal
    btn.closest('.key-modal-overlay').remove();
    editAgent(agentId);
  } catch(e) { alert(e.message); }
}

async function deleteSkill(id) {
  if (!confirm('确定删除这个 Skill？')) return;
  try {
    await api(`/api/skills/${id}`, { method: 'DELETE' });
    document.querySelector('.key-modal-overlay')?.remove();
  } catch(e) { alert(e.message); }
}
