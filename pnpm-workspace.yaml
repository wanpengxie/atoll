# pnpm workspace — M1.5 单栈 target layout
#
# spec: .dalek/pm/m1.5-tickets.md §T8
#       .dalek/pm/m1.5-server-rewrite-and-restructure.md §15.1
#
# 加入：
#   - ui                                (T7 落地：原生 Vite UI)
#   - adapters/device/xhs/extension     (T5 已落地：xhs 浏览器扩展)
#
# 已归档（T9 完成；不再出现在 workspace 里）：
#   - cli / agent-binary / lightcone/** / packages/payload-types / workspace-template
#   - 各自的归档位置见 archive/<dir>/ARCHIVE.md
#
# 未匹配的 glob 不会让 pnpm install 失败。
packages:
  - 'ui'
  - 'adapters/device/xhs/extension'
  - 'adapters/device/xhs/extension/packages/*'
  - 'adapters/device/xhs/extension/app/*'

allowBuilds:
  bcrypt: true
  better-sqlite3: true

# Force a single vite version across the workspace.
# Without this, pnpm hoists two vites (one for ui/, one transitively for
# wxt/module-vue) and wxt's download plugin filter API (vite 6.3+) breaks
# under the older vite assigned to wxt's build pipeline.
overrides:
  vite: '^8.0.13'
