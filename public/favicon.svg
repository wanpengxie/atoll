<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3226"/>
      <stop offset="100%" stop-color="#2E2419"/>
    </linearGradient>
    <linearGradient id="cone" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F5F0E8" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#F5F0E8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.18">
      <stop offset="0%" stop-color="#E4002B"/>
      <stop offset="100%" stop-color="#E4002B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background - dark brown -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Light cone body -->
  <path d="M256 60 L432 456 Q256 412 80 456 Z" fill="url(#cone)" opacity="0.9"/>
  <!-- Apex glow - red -->
  <circle cx="256" cy="60" r="32" fill="url(#glow)"/>
  <!-- Base arc -->
  <path d="M92 446 Q256 404 420 446" stroke="#F5F0E8" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
